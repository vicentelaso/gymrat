function chartHTML(xid) {
  const pts = chartPoints(xid);
  if (!pts.length) return `<p class="empty">Aquí verás tu progreso cuando registres series.</p>`;
  const n = pts.length, W = 340, H = 180, l = 38, r = 14, tp = 14, b = 26;
  const vs = pts.map((p) => p.v);
  let mn = Math.min(...vs), mx = Math.max(...vs);
  const M = modeOf(xid);
  // escala con números redondos (2,5 · 5 · 10 …)
  const span = Math.max(mx - mn, M === 'reps' ? 2 : 2.5);
  const step = [1, 2, 2.5, 5, 10, 20, 25, 50, 100].find((s) => span / s <= 4) || 100;
  mn = Math.floor((mn - step * 0.3) / step) * step; mx = Math.ceil((mx + step * 0.3) / step) * step;
  if (mn < 0) mn = 0;
  const X_ = (i) => (n === 1 ? l + (W - l - r) / 2 : l + (i * (W - l - r)) / (n - 1));
  const Y_ = (v) => tp + (1 - (v - mn) / (mx - mn)) * (H - tp - b);
  const sel = chartSel == null || chartSel >= n ? n - 1 : chartSel;
  let g = '';
  for (let v = mn; v <= mx + 1e-9; v += step) {
    const y = Y_(v).toFixed(1);
    g += `<line x1="${l}" x2="${W - r}" y1="${y}" y2="${y}" stroke="#262626" stroke-width="1"/><text x="${l - 8}" y="${y}" dy="4" text-anchor="end" font-size="11" fill="#8a8580">${nf(v, 1)}</text>`;
  }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X_(i).toFixed(1)} ${Y_(p.v).toFixed(1)}`).join(' ');
  const area = n > 1 ? `<path d="${line} L${X_(n - 1).toFixed(1)} ${H - b} L${X_(0).toFixed(1)} ${H - b} Z" fill="#FF6A1F" fill-opacity=".12"/>` : '';
  const dots = pts.map((p, i) => i === sel
    ? `<circle cx="${X_(i).toFixed(1)}" cy="${Y_(p.v).toFixed(1)}" r="6.5" fill="#FF6A1F"/>`
    : `<circle cx="${X_(i).toFixed(1)}" cy="${Y_(p.v).toFixed(1)}" r="3.5" fill="#000" stroke="#FF6A1F" stroke-width="2"/>`).join('');
  const hits = pts.map((p, i) => `<circle cx="${X_(i).toFixed(1)}" cy="${Y_(p.v).toFixed(1)}" r="16" fill="transparent" data-act="pt" data-i="${i}" style="cursor:pointer"/>`).join('');
  const xl = `<text x="${X_(0).toFixed(1)}" y="${H - 6}" text-anchor="${n === 1 ? 'middle' : 'start'}" font-size="11" fill="#8a8580">${fShort(pts[0].d)}</text>` +
    (n > 1 ? `<text x="${X_(n - 1).toFixed(1)}" y="${H - 6}" text-anchor="end" font-size="11" fill="#8a8580">${fShort(pts[n - 1].d)}</text>` : '');
  const sp = pts[sel];
  let trend = '';
  if (n > 1) {
    const k = kindOf(xid), dv = pts[n - 1].v - pts[0].v;
    const unit = M === 'reps' ? (k === 'time' ? ' s' : k === 'cardio' ? ' min' : ' reps') : M === 'km' ? ' km' : M === 'spd' ? ' km/h' : ' kg';
    const lessIsBetter = k === 'assist' && M === 'peso';
    const good = lessIsBetter ? dv < 0 : dv > 0, bad = lessIsBetter ? dv > 0 : dv < 0;
    const what = lessIsBetter ? `${nf(Math.abs(dv))} kg de ayuda` : `${nf(Math.abs(dv))}${unit}`;
    trend = `<p class="csum ${good ? 'up' : bad ? 'down' : ''}">${dv > 0 ? `Subiste ${what}` : dv < 0 ? `Bajaste ${what}` : 'Te mantienes igual'} desde el ${fShort(pts[0].d)} <span>en ${plural(n, 'sesión', 'sesiones')}</span></p>`;
  }
  return `${trend}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de progreso">${g}${area}<path d="${line}" fill="none" stroke="#FF6A1F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}${hits}</svg>
    <div class="cinfo"><span class="cd">${cap(fLong(sp.d))}</span><span class="cv">${kindOf(xid) === 'cardio' ? 'Mejor marca' : 'Mejor serie'}: <b>${kindOf(xid) !== 'kg' ? setTxt(sp.s) : `${nf(sp.s.kg)} kg × ${sp.s.reps} reps`}</b></span><span class="cx">${kindOf(xid) === 'cardio' ? (sp.n > 1 ? `${sp.i}.º registro de ${sp.n}` : 'Único registro del día') : sp.n > 1 ? `${sp.i}.ª serie de ${sp.n}` : 'Única serie del día'}${sp.s.kg > 0 && kindOf(xid) === 'kg' ? ` · 1RM estimado ${nf(rm1(sp.s))} kg` : ''}${kindOf(xid) === 'cardio' && sp.s.km > 0 ? ` · ${nf(kmh(sp.s))} km/h` : ''}</span></div>`;
}

    [/jalon/, () => has(/recto|rigido/) ? 'cpull' : 'pulldown'],

    [/apertura|peck|mariposa|cruce|crossover|fly/, 'fly'], [/flexion|push ?up/, 'pushup'], [/fondo|dip/, 'dip'],
    [/press/, () => has(/inclinad/) ? 'incline' : has(/declinad/) ? 'decline' : has(/militar|hombro|arnold|arriba|overhead/) ? 'ohpress' : has(/pierna|prensa/) ? 'legpress' : has(/maquina/) && pid === 'pecho' ? 'cpress' : 'bench'],
    [/elevacion|vuelo/, () => has(/talon|pantorr|gemel/) ? (has(/sentad/) ? 'calfseat' : 'calf') : has(/pierna|rodilla/) ? (has(/colgad|paralela|barra/) ? 'legraise' : 'legraiseL') : has(/frontal/) ? 'frontraise' : 'lateral'],
    [/pajaro|posterior|reverse/, 'lateral'], [/face ?pull/, 'facepull'], [/encogim|shrug/, 'shrug'],
    [/prensa|leg press/, () => has(/horizontal|sentad|seated/) ? 'legpressH' : 'legpress'],
    [/hack|pendulo/, () => has(/pantorr|talon|gemel/) ? 'calfhack' : 'hack'],
    [/sentadilla|squat/, 'squat'], [/estocada|zancada|bulgara|cajon|step|lunge/, 'lunge'],
    [/hip thrust|puente|glute bridge/, 'hipthrust'], [/abduc/, 'abduct'], [/aduc/, 'adduct'],
    [/talon|pantorr|gemel|calf/, () => has(/sentad/) ? 'calfseat' : 'calf'],
    [/crunch|encogimiento abdominal/, () => has(/polea/) ? 'cablecrunch' : has(/maquina/) ? (has(/oblicu/) ? 'twist' : 'crunchmach') : 'crunch'],
    [/giro|ruso|russian/, 'russian'], [/lenador|inclinacion lateral|oblicu/, 'sidebend'], [/rotacion|pallof/, 'twist'],
    [/plancha|plank|mountain|escalador/, 'plank'], [/rueda/, 'wheel']
  ];
  for (const [re, v] of rules) if (has(re)) { pose = typeof v === 'function' ? v() : v; break; }
  let tool = null;
  if (has(/polea|cable|cuerda/)) tool = 'c';
  else if (has(/mancuerna|goblet|db /)) tool = 'd';
  else if (has(/barra|smith|disco|olimpic/)) tool = 'b';
  else if (has(/maquina|hack|prensa|peck|pendulo|asistid/)) tool = 'm';
  else if (has(/flexion|dominada|plancha|fondo|crunch|puente|colgad/)) tool = 'n';
  const p = P(pid);
  const pick = (re, name) => (has(re) && p?.muscles.find((m) => norm(m.n).includes(name)) ? p.muscles.find((m) => norm(m.n).includes(name)).n : null);
  const m = pick(/inclinad/, 'superior') || pick(/declinad|fondo/, 'inferior') ||
    pick(/jalon|dominada|pullover/, 'dorsal') || pick(/remo/, 'media') || pick(/lumbar|peso muerto|hiperext|buenos dias/, 'lumbar') ||
    pick(/lateral|menton/, 'lateral') || pick(/pajaro|posterior|face/, 'posterior') || pick(/encogim|trapecio/, 'trapecio') || pick(/frontal|press|militar|arnold/, 'anterior') ||
    pick(/martillo|invertido|muneca|antebrazo/, 'braquial') || pick(/frances|nuca|cabeza|sobre la cabeza/, 'larga') ||
    pick(/femoral|rumano|isquio/, 'isquio') || pick(/aduc|sumo/, 'aductor') || pick(/glute|hip|puente|patada|abduc/, 'glute') || pick(/talon|pantorr|gemel/, 'pantorr') ||

  if (mode === 'assist' && !tool) tool = 'm';

/* duración de una sesión: la registrada al terminar o, si no, del primer al último registro */
function sessionTime(d, rid, arr) {
  const s = S.sessions?.[d + '|' + rid];

/* resumen final */
function fmtDur(min) {
  if (min < 1) return '—';
  if (min < 60) return Math.round(min) + ' min';
  return `${Math.floor(min / 60)} h ${Math.round(min % 60)}`;
}
function finish(rid) {
  const r = R(rid);
  const td = todayR(rid);
  if (!td.length) return;
  const vol = td.reduce((a, l) => a + volKg(l), 0);
  const exs = new Set(td.map((l) => l.x)).size;
  const end = Math.min(Date.now(), td[td.length - 1].ts + 30 * 60000);
  S.sessions = S.sessions || {};
  S.sessions[today() + '|' + rid] = { start: td[0].ts, end };
  save();
  const dur = (end - td[0].ts) / 60000;
  const prs = td.filter((l) => l.pr);

/* ---------- cronómetro para ejercicios por tiempo ---------- */
let swOn = false, swStart = 0, swIv = null;
const swSec = () => Math.floor((Date.now() - swStart) / 1000);
const fmtClock = (s) => `${Math.floor(s / 60)}:${pad(s % 60)}`;
function stopSW(fill) {

let wl = null, wantWake = false;
async function wake(on) {
  wantWake = on;
  try {
    if (on && !wl && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    } else if (!on && wl) { await wl.release(); wl = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wantWake) wake(true); });

    const xid = curX(), reps = $('#fr')?.value || '';
    kmOpen = !kmOpen;
    draft = { x: xid, reps, w: kmOpen ? (lastKm(xid) ? inNum(lastKm(xid)) : '') : '' };
    render();
    if (kmOpen) setTimeout(() => { const f = $('#fw'); if (f) { f.focus(); f.select(); } }, 60);
  },
  stopw: () => {
    if (swOn) { stopSW(true); render(); toast(`Tiempo: ${fmtT(parseInt($('#fr').value, 10) || 0)}. Revisa y guarda la serie.`); return; }
    swOn = true; swStart = Date.now();
    draft = { x: curX(), w: $('#fw')?.value || '', reps: $('#fr')?.value || '' };
    render();
    swIv = setInterval(() => { const t = $('#swt'), f = $('#fr'); if (!t) { stopSW(false); return; } t.textContent = fmtClock(swSec()); if (f) f.value = String(swSec()); }, 250);
  },
  tact: () => { const f = TA; TA = null; $('#toast').classList.remove('on'); f?.(); },
  cm: (el) => { chartM = el.dataset.m; chartSel = null; draft = { x: curX(), w: $('#fw').value, reps: $('#fr').value }; render(); },
  pt: (el) => { chartSel = Number(el.dataset.i); $('#chart').innerHTML = chartHTML(curX()); },

  today: (el) => openToday(el.dataset.r),
  finish: (el) => finish(el.dataset.r),
  done: () => { hideSheet(); goHome(); },

  cmove: (el) => { calM = new Date(calM.getFullYear(), calM.getMonth() + Number(el.dataset.d), 1); calSel = null; renderCal(); },
  cday: (el) => { calSel = el.dataset.d; renderDay(calSel); $('#sheet').scrollTop = 0; },
  calback: () => { renderCal(); $('#sheet').scrollTop = 0; },

  rmove: (el) => {
    const favs = S.routines.filter((r) => r.fav);
    const i = favs.findIndex((r) => r.id === el.dataset.id), j = i + Number(el.dataset.d);
    if (i < 0 || j < 0 || j >= favs.length) return;
    const a = S.routines.indexOf(favs[i]), b = S.routines.indexOf(favs[j]);
    [S.routines[a], S.routines[b]] = [S.routines[b], S.routines[a]];
    save(); openSettings();
  },
  statsp: (el) => { statsP = Number(el.dataset.p); render(); },
  sunit: (el) => { S.settings.unit = el.dataset.u; save(); openSettings(); },
  exp: () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `gymrat-respaldo-${today()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast('Respaldo descargado');
  }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const f = A[el.dataset.act];
  if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('input', (e) => {
  const t = e.target, b = t.dataset?.bind;
  if (b === 'ername' && ER) ER.name = t.value;
  if (b === 'exname' && EX) { EX.name = t.value; if (!EX.id) { clearTimeout(exT); exT = setTimeout(() => { applySuggest(); refreshEX(); }, 250); } }
  if (b === 'exdesc' && EX) EX.desc = t.value;
  if (b === 'sname') { S.settings.name = t.value; save(); }
  if (b === 'sbw') { S.settings.bw = t.value.replace(/[^0-9.,]/g, ''); save(); }
  if (t.id === 'lu') loginDraft.u = t.value;
  if (t.id === 'lp') loginDraft.pw = t.value;
  if (t.id === 'q') { const p = P(parse()[3]); if (p) { filt[p.id].q = t.value; applyFilter(); } }
  if (t.id === 'fw') t.value = t.value.replace(/[^0-9.,]/g, '');
  if (t.id === 'fr') t.value = t.value.replace(/[^0-9]/g, '');
  if (t.id === 'fw' || t.id === 'fr') draft = { x: curX(), w: $('#fw')?.value || '', reps: $('#fr')?.value || '' };
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'lu') { e.preventDefault(); $('#lp').focus(); }
  else if (id === 'lp') { e.preventDefault(); doAuth(); }
  else if (id === 'npn') A.ernpok();
  else if (id === 'nmn') A.exnmok();
  else if (id === 'fw') { e.preventDefault(); if (curFirst === 'fr') A.add(); else $('#fr').focus(); }
  else if (id === 'fr') { e.preventDefault(); if (curFirst === 'fr' && $('#fw')) $('#fw').focus(); else A.add(); }
  else if (id === 'q') e.target.blur();
});
document.addEventListener('focusin', (e) => { if (e.target.classList?.contains('num')) setTimeout(() => e.target.select(), 0); });
document.addEventListener('change', (e) => {
  if (e.target.id !== 'imp') return;
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d.parts || !d.routines || !d.logs) throw new Error();
      confirmS({ title: '¿Restaurar respaldo?', text: `Tus datos actuales se reemplazarán por los del archivo (${plural(d.logs.length, 'serie', 'series')}).`, cta: 'Restaurar', ok: () => { S = migrate(d); S.settings = Object.assign({ name: '', unit: 'kg', asked: true }, S.settings); save(); closeSheet(); toast('Respaldo restaurado'); } });
    } catch (err) { toast('Ese archivo no es un respaldo de GymRat'); }
  };
  rd.readAsText(file);
});

/* ---------- inicio ---------- */
async function boot() {
  if (!history.state) history.replaceState({ d: 0 }, '', location.hash || '#/');
  render();
  if (configured) {
    makeClient(remembered());
    try {
      const { data } = await sb.auth.getSession();
      if (data?.session?.user) { USER = data.session.user; await loadUserData(); }
    } catch (e) {}
  }
  booting = false;
  render();
}
boot();
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
