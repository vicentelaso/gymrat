        ${st.cTop ? `<div class="scard"><b class="sm">${esc(st.cTop.name)}</b><span>el que más haces</span></div>` : ''}
      </div>`);
  }
  return html;
}

/* ---------- Resumen ---------- */
function vStatsS() {
  const all = !statsP, rid = SF.rid && R(SF.rid) ? SF.rid : '';
  let html = `${hdr('/stats', 'Estadísticas')}<h2 class="pt">Resumen</h2>${stSeg()}${stTip()}`;
  const { since, until } = periodOf(statsP);
  const rids = [...new Set(S.logs.filter((l) => l.d >= since && l.d <= until && R(l.r)).map((l) => l.r))];
  if (rids.length > 1) {
    const dn = {}; S.logs.forEach((l) => { if (l.d >= since && l.d <= until && R(l.r)) (dn[l.r] || (dn[l.r] = new Set())).add(l.d); });
    html += ddFilter('res', 'Rutina', 'Todas las rutinas', S.routines.filter((r) => rids.includes(r.id)).map((r) => [r.id, r.name, dn[r.id].size]), rid, 'sres', new Set(S.logs.filter((l) => l.d >= since && l.d <= until).map((l) => l.d)).size);
  }
  if (rid && !rids.includes(rid)) { SF.rid = ''; return vStatsS(); }
  const A = resData(statsP, 0, rid), B = statsP ? resData(statsP, 1, rid) : null;
  if (!A) return html + stEmpty();
  const tile = (v, l, extra = '', cls = '') => `<div class="scard${cls ? ' ' + cls : ''}"><b>${v}</b><span>${l}</span>${extra}</div>`;
  const T = [];
  if (!all) {
    T.push(tile(nf(A.days, 0), A.days === 1 ? 'día entrenado' : 'días entrenados', `${dlt(A.days, B?.days, (v) => nf(v, 0))}<small class="ssm">${A.wTrained} de ${plural(A.wTotal, 'semana', 'semanas')} con entrenamiento</small>`, 'hot'));
    T.push(tile(nf(A.perWeek, 1), 'veces por semana', dlt(A.perWeek, B?.perWeek)));
    T.push(tile(fmtDur(A.avgMin), 'duración promedio', dlt(A.avgMin, B?.avgMin, (v) => fmtDur(v), 0)));
    T.push(tile(nf(A.setsPer, 0), 'series por entrenamiento', dlt(A.setsPer, B?.setsPer, (v) => nf(v, 0))));
    T.push(tile(`${nf(A.volW / 1000, 1)} t`, 'volumen por semana', dlt(A.volW / 1000, B ? B.volW / 1000 : null, (v) => nf(v, 1) + ' t')));
    T.push(tile(nf(A.prEx, 0), A.prEx === 1 ? 'ejercicio con récord' : 'ejercicios con récord', dlt(A.prEx, B?.prEx, (v) => nf(v, 0))));
    if (A.fN >= 2) T.push(tile(pctTxt(A.fMed), `fuerza: mediana de ${A.fN} ejercicios`, '', A.fMed > 0.01 ? 'pos' : A.fMed < -0.01 ? 'neg' : ''));
    if (A.cardioW > 0.5) T.push(tile(fmtDur(A.cardioW), 'cardio por semana', dlt(A.cardioW, B?.cardioW, (v) => fmtDur(v))));
    if (!rid) { const bw = (S.bw || []).slice().sort((a, b) => (a.d < b.d ? -1 : 1)), tr = bwTrend(bw).filter((x) => x.d >= since); if (tr.length >= 2) { const c = tr[tr.length - 1].t - tr[0].t; T.push(tile(Math.abs(c) < 0.05 ? '=' : `${c > 0 ? '+' : '−'}${nf(Math.abs(c))} kg`, 'peso corporal (tendencia)')); } }
    T.push(tile(nf(A.nEx, 0), 'ejercicios distintos', A.newEx ? `<em class="dl nt">${plural(A.newEx, 'nuevo', 'nuevos')}</em>` : ''));
    html += `<div class="sgrid">${T.join('')}</div>`;
    return html;
  }
  // Todo: totales que tienen sentido, promedios y año a año
  const st = statsData(0), tf = trainingFor(firstLogD());
  const yr = yearRows(rid), mc = {};
  S.logs.forEach((l) => { if (rid && l.r !== rid) return; const k = l.d.slice(0, 7); (mc[k] || (mc[k] = new Set())).add(l.d); });
  const bm = Object.entries(mc).map(([k, s]) => [k, s.size]).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? 1 : -1))[0];
  T.push(tile(nf(A.days, 0), A.days === 1 ? 'día entrenado' : 'días entrenados', '', 'hot'));
  T.push(tile(tf.b, `entrenando · ${tf.s}`, '', 'mdv'));
  T.push(tile(nf(A.perWeek, 1), 'veces por semana (promedio)'));
  T.push(tile(fmtDur(A.avgMin), 'duración promedio'));
  if (!rid) T.push(tile(nf(st.best, 0), st.best === 1 ? 'semana: tu mejor racha' : 'semanas: tu mejor racha'));
  if (bm) T.push(tile(plural(bm[1], 'día', 'días'), `mejor mes: ${MES3[Number(bm[0].slice(5)) - 1]} ${bm[0].slice(0, 4)}`, '', 'mdv'));
  if (A.fN >= 2) T.push(tile(pctTxt(A.fMed), `fuerza desde que empezaste (mediana de ${A.fN})`, '', A.fMed > 0.01 ? 'pos' : ''));
  T.push(tile(nf(A.nEx, 0), 'ejercicios distintos'));
  html += `<div class="sgrid">${T.join('')}</div>
    <p class="lbl">Año a año</p>
    <div class="ytable"><span class="yh">Año</span><span class="yh">Días</span><span class="yh">Por sem.</span><span class="yh">t/sem</span><span class="yh">Récords</span>
      ${yr.map((r) => `<span class="yy">${r.y}${r.part ? '<i>*</i>' : ''}</span><span>${nf(r.days, 0)}</span><span>${nf(r.pw, 1)}</span><span>${nf(r.volW / 1000, 1)}</span><span>${nf(r.rec, 0)}</span>`).join('')}</div>
    <p class="bcap">Récords: ejercicios en que superaste tu marca ese año.${yr.some((r) => r.part) ? ' * Año incompleto: promedios sobre las semanas transcurridas.' : ''}</p>`;
  return html;
}

/* ---------- Progreso de fuerza ---------- */
function vStatsF() {
  const all = !statsP, st = statsData(statsP), list = st ? st.prog : [];
  let html = `${hdr('/stats', 'Estadísticas')}<h2 class="pt">Progreso de fuerza</h2>${stSeg()}${stTip(`${all ? 'Tu mejor serie (1RM estimado) en tus primeras sesiones vs. las últimas.' : 'Tu mejor serie (1RM estimado) al inicio vs. al final del período, en ejercicios con 2 o más días.'} En los por tiempo, cada 3 s cuentan como una repetición.`)}`;
  if (!list.length) return html + stEmpty('Con dos días de un mismo ejercicio verás aquí cuánto sube.');
  if (SF.part && !list.some((p) => p.pid === SF.part)) SF.part = '';
  const byPart = list.filter((p) => !SF.part || p.pid === SF.part);
  const cnt = { all: byPart.length, up: byPart.filter((p) => pctCls(p.pct) === 'up').length, eq: byPart.filter((p) => pctCls(p.pct) === 'eq').length, dn: byPart.filter((p) => pctCls(p.pct) === 'dn').length };
  // promedio de cada parte del cuerpo (tócala para ver sus ejercicios)
  const pp = partProg(list);
  if (!SF.part && pp.list.length > 1) html += `<div class="ppgrid">${pp.list.map((g) => `<button class="pptile${g === pp.top && g.pct > 0.01 ? ' top' : ''}" data-act="sfpart" data-v="${g.pid}">${pIco([g.pid], 34)}<span class="grow"><small>${esc(g.name)}</small><b class="${pctCls(g.pct)}">${pctTxt(g.pct)}<em>${g.n} ej.</em></b></span></button>`).join('')}</div>`;
  html += `<div class="seg hseg sfseg" role="group" aria-label="Filtrar">${[['all', 'Todos'], ['up', 'Suben'], ['eq', 'Igual'], ['dn', 'Bajan']].map(([k, l]) => `<button data-act="sfdir" data-v="${k}" class="${SF.dir === k ? 'on' : ''}" aria-pressed="${SF.dir === k}">${l}<i>${cnt[k]}</i></button>`).join('')}</div>`;
  html += partDD('fz', list.map((p) => p.pid), 'sfpart', SF.part);
  const rows = byPart.filter((p) => SF.dir === 'all' || pctCls(p.pct) === SF.dir);
  if (rows.length >= 2) { const av = rows.reduce((s, p) => s + p.pct, 0) / rows.length; html += `<p class="fsum">Promedio: <b class="${pctCls(av)}">${pctTxt(av)}</b> en ${plural(rows.length, 'ejercicio', 'ejercicios')}</p>`; }
  html += `<div class="slist">${rows.map((p) => `<button class="frow lnk" data-act="nav" data-to="${exLink(p.x)}">${xIco(p.x)}<span class="grow">${esc(p.name)}<small class="sub2">${esc(p.pname)} · ${p.k === 'kg' ? `1RM ${nf(p.a, 0)} → ${nf(p.b, 0)} kg` : `${setTxt(p.s0, true)} → ${setTxt(p.s1, true)}`}${all ? ` · ${spanTxt(p.d0, p.d1)}` : ''}</small></span><span class="frr"><b class="pct ${pctCls(p.pct)}">${pctTxt(p.pct)}</b>${all ? '' : spark(p.sp, 72, 22)}</span></button>`).join('') || '<p class="mu" style="margin:14px 0">Ningún ejercicio con este filtro.</p>'}</div>`;
  return html;
}

/* ---------- Récords (en "Todo": mejores marcas) ---------- */
function vStatsR() {
  if (!statsP) return vMarks();
  const st = statsData(statsP), pv = statsData(statsP, 1), grp = st ? recGroups(st.prs) : [], near = nearPRs();
  let html = `${hdr('/stats', 'Estadísticas')}<h2 class="pt">Récords</h2>${stSeg()}${stTip('Uno por ejercicio: cuando tu mejor serie supera a todas las anteriores. Si lo rompiste varias veces, se muestra el último.')}`;
  if (!grp.length) return html + stEmpty('Aún no hay récords en este período.') + nearHTML(near);
  const top = grp.reduce((b, g) => (!b || g.e.gain > b.e.gain ? g : b), null), nm = (x) => esc(X(x)?.e.name || 'Ejercicio');
  html += `<div class="prhero"><div><b>${grp.length}</b><span>${grp.length === 1 ? 'ejercicio' : 'ejercicios'} con récord</span>${pv ? dlt(grp.length, recGroups(pv.prs).length, (v) => nf(v, 0)) : ''}</div><div class="prtop"><small>Mayor subida</small><span class="prx">${xIco(top.x, 36)}<b>${nm(top.x)}</b></span><em>${pctTxt(top.e.gain)}</em></div></div>`;
  // la mayor subida de cada parte del cuerpo (último récord vs. la marca anterior)
  const byP = new Map(); grp.forEach((g) => { const b = byP.get(g.p.id); if (!b || g.e.gain > b.e.gain) byP.set(g.p.id, g); });
  const pl = S.parts.filter((p) => byP.has(p.id)).map((p) => byP.get(p.id));
  html += `<p class="lbl">${ic('up', 15)} Mayor subida por parte del cuerpo</p><div class="vit">${pl.map((g) => `<button class="vcard lnk" data-act="nav" data-to="${exLink(g.x)}"><span class="vch"><small>${esc(g.p.name)}</small>${pIco([g.p.id], 40)}</span><b class="up">${pctTxt(g.e.gain)}</b><span class="vcx">${xIco(g.x, 36)}<span>${nm(g.x)}</span></span><em>${setTxt(g.e.s, true)}${g.e.ps ? ` · antes ${setTxt(g.e.ps, true)}` : ''}</em></button>`).join('')}</div>`;
  // cada ejercicio con récord (el último)
  if (SF.rpart && !grp.some((g) => g.p.id === SF.rpart)) SF.rpart = '';
  const rows = grp.filter((g) => !SF.rpart || g.p.id === SF.rpart);
  html += `<p class="lbl">Ejercicios con récord</p>${partDD('rc', grp.map((g) => g.p.id), 'srpart', SF.rpart)}
    <div class="slist">${rows.map((g) => `<button class="prrow lnk xrow" data-act="nav" data-to="${exLink(g.x)}">${xIco(g.x)}<span class="grow">${nm(g.x)}<small class="sub2">${cap(rel(g.e.d))} · ${pctTxt(g.e.gain)}${g.n > 1 ? ` · ${g.n} veces` : ''}</small></span><b>${setTxt(g.e.s)}</b></button>`).join('')}</div>`;
  return html + nearHTML(near);
}
function vMarks() {

  if (tired.length) L.push(['clock', `Entrenaste ${B(tired.join(' y '))} ayer: hoy mantén los pesos y cuida la técnica`]);
  // equilibrio

  if (eq.length) { const i = eq[0], ld = ctx.mlast[i.pid + '|' + i.e.m]; L.push(['body', `${B(i.e.name)} para ${lc(i.e.m)}: ${ld ? `${daysAgo(ld)} días sin trabajarlo` : 'casi no lo trabajas'}`]); }

/* ---------- terminar ---------- */
function finish(rid) {
  const td = todayR(rid), plan = planOf(rid);
  if (!td.length) {
    confirmS({ title: '¿Cancelar el entrenamiento?', text: 'Aún no anotas series. Tu plan se mantiene.', cta: 'Cancelar entrenamiento', ok: () => { if (plan) { delete plan.st; delete plan.en; } if (S.sessions) delete S.sessions[today() + '|' + rid]; save(); render(); } });
    return;
  }
  S.sessions = S.sessions || {};
  const key = today() + '|' + rid, prev = S.sessions[key], lastTs = td[td.length - 1].ts;
  if (!prev?.manual) {
    let end = Date.now();
    if (end - lastTs > 45 * 60000) end = lastTs + 10 * 60000; // si se te olvidó tocar "Terminar", corta en tu última serie
    S.sessions[key] = { start: Math.min(prev?.start ?? plan?.st ?? td[0].ts, td[0].ts), end };
  }
  if (plan) {
    plan.en = S.sessions[key].end;
    /* lo que te saltaste del plan cuenta como "no me gustó"; los ejercicios nuevos que hiciste, como "me gusta probar" */
    if (!plan.ev) {
      plan.ev = 1;
      const doneX = new Set(td.map((l) => l.x)), c = coach();
      plan.items.forEach((it) => { const f = X(it.x); if (!f || doneX.has(it.x)) return; coachRej(it.x, it.p, 0.7, !td.some((l) => X(l.x)?.p.id === it.p && X(l.x)?.e.m === f.e.m)); });
      doneX.forEach((x) => { if (!S.logs.some((l) => l.x === x && l.d < today())) coachBump(c.g, 'na', 1); });
    }
  }
  save(); render();
  showSummary(rid);
}

/* ---------- gráfico de línea simple ---------- */
function lineSvg(pts, fmt = (v) => nf(v, 1), xfmt = fShort) {
  if (!pts.length) return '';
  const n = pts.length, W = 340, H = 150, l = 40, r = 12, tp = 12, b = 24;
  const vs = pts.map((p) => p.v);
  let mn = Math.min(...vs), mx = Math.max(...vs);
  const span = Math.max(mx - mn, 1);
  const step = [0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000].find((s) => span / s <= 3) || 10000;
  mn = Math.floor((mn - step * 0.3) / step) * step; mx = Math.ceil((mx + step * 0.3) / step) * step;
  if (mn < 0) mn = 0;
  const X_ = (i) => (n === 1 ? l + (W - l - r) / 2 : l + (i * (W - l - r)) / (n - 1));
  const Y_ = (v) => tp + (1 - (v - mn) / (mx - mn || 1)) * (H - tp - b);
  let g = '';
  for (let v = mn; v <= mx + 1e-9; v += step) { const y = Y_(v).toFixed(1); g += `<line x1="${l}" x2="${W - r}" y1="${y}" y2="${y}" stroke="#262626"/><text x="${l - 7}" y="${y}" dy="4" text-anchor="end" font-size="11" fill="#8a8580">${fmt(v)}</text>`; }

/* sugerencia automática de dibujo, implemento y músculo a partir del nombre */
function suggestEx(name, pid) {
  const n = ' ' + norm(name) + ' ';
  const has = (re) => re.test(n);
  let pose = null;
  const rules = [
    [/curl/, () => has(/femoral/) ? (has(/sentad/) ? 'seatcurl' : has(/de pie/) ? 'standcurl' : 'legcurl') : has(/poleas? bajas?|dos poleas|2 poleas/) ? 'curl2low' : has(/poleas? altas?|doble/) ? 'curl2c' : has(/predicador|scott|arana|banco/) ? 'preacher' : 'curl'],
    [/press frances|rompecraneo|skull/, 'skull'],
    [/extension/, () => has(/cuadricep|pierna|rodilla/) ? 'legext' : has(/cabeza|nuca|sobre/) ? 'ohext' : 'pushdown'],
    [/patada|kickback/, () => (pid === 'triceps' || has(/tricep/)) ? 'tkick' : 'kickback'],
    [/jalon/, () => has(/recto|rigido/) ? 'cpull' : 'pulldown'],
    [/dominada|chin/, 'pullup'], [/pullover/, () => has(/polea/) ? 'cpull' : 'pullover'],
    [/remo/, () => has(/menton|alto/) ? 'uprow' : has(/invertid|australian/) ? 'invrow' : has(/polea|sentad|maquina|gironda/) ? 'row' : 'bentrow'],
    [/peso muerto|rack pull|buenos dias/, 'deadlift'], [/hiperext|lumbar/, 'hyper'],
    [/apertura|peck|mariposa|cruce|crossover|fly/, 'fly'], [/flexion|push ?up/, 'pushup'], [/fondo|dip/, 'dip'],
    [/press/, () => has(/inclinad/) ? 'incline' : has(/declinad/) ? 'decline' : has(/militar|hombro|arnold|arriba|overhead/) ? 'ohpress' : has(/pierna|prensa/) ? 'legpress' : has(/maquina/) && pid === 'pecho' ? 'cpress' : 'bench'],
    [/elevacion|vuelo/, () => has(/talon|pantorr|gemel/) ? (has(/sentad/) ? 'calfseat' : 'calf') : has(/pierna|rodilla/) ? (has(/colgad|paralela|barra/) ? 'legraise' : 'legraiseL') : has(/frontal/) ? 'frontraise' : 'lateral'],
    [/pajaro|posterior|reverse/, 'lateral'], [/face ?pull/, 'facepull'], [/encogim|shrug/, 'shrug'],
    [/prensa|leg press/, () => has(/horizontal|sentad|seated/) ? 'legpressH' : 'legpress'],
    [/hack|pendulo/, () => has(/pantorr|talon|gemel/) ? 'calfhack' : 'hack'],
    [/sentadilla|squat/, 'squat'], [/estocada|zancada|bulgara|cajon|step|lunge/, 'lunge'],
    [/hip thrust|puente|glute bridge/, 'hipthrust'], [/abduc/, 'abduct'], [/aduc/, 'adduct'],
    [/talon|pantorr|gemel|calf/, () => has(/sentad/) ? 'calfseat' : 'calf'],
    [/crunch|encogimiento abdominal/, () => has(/polea/) ? 'cablecrunch' : has(/maquina/) ? (has(/oblicu/) ? 'twist' : 'crunchmach') : 'crunch'],
    [/giro|ruso|russian/, 'russian'], [/lenador|inclinacion lateral|oblicu/, 'sidebend'], [/rotacion|pallof/, 'twist'],
    [/plancha|plank|mountain|escalador/, 'plank'], [/rueda/, 'wheel']
  ];
  for (const [re, v] of rules) if (has(re)) { pose = typeof v === 'function' ? v() : v; break; }
  let tool = null;
  if (has(/polea|cable|cuerda/)) tool = 'c';
  else if (has(/mancuerna|goblet|db /)) tool = 'd';
  else if (has(/barra|smith|disco|olimpic/)) tool = 'b';
  else if (has(/maquina|hack|prensa|peck|pendulo|asistid/)) tool = 'm';
  else if (has(/flexion|dominada|plancha|fondo|crunch|puente|colgad/)) tool = 'n';
  const p = P(pid);
  const pick = (re, name) => (has(re) && p?.muscles.find((m) => norm(m.n).includes(name)) ? p.muscles.find((m) => norm(m.n).includes(name)).n : null);
  const m = pick(/inclinad/, 'superior') || pick(/declinad|fondo/, 'inferior') ||
    pick(/jalon|dominada|pullover/, 'dorsal') || pick(/remo/, 'media') || pick(/lumbar|peso muerto|hiperext|buenos dias/, 'lumbar') ||
    pick(/lateral|menton/, 'lateral') || pick(/pajaro|posterior|face/, 'posterior') || pick(/encogim|trapecio/, 'trapecio') || pick(/frontal|press|militar|arnold/, 'anterior') ||
    pick(/martillo|invertido|muneca|antebrazo/, 'braquial') || pick(/frances|nuca|cabeza|sobre la cabeza/, 'larga') ||
    pick(/femoral|rumano|isquio/, 'isquio') || pick(/aduc|sumo/, 'aductor') || pick(/glute|hip|puente|patada|abduc/, 'glute') || pick(/talon|pantorr|gemel/, 'pantorr') ||
    pick(/oblicu|giro|lenador|lateral|rotacion|bicicleta/, 'oblicu') || pick(/plancha|rueda|pallof|core/, 'core') || null;

  if (mode === 'assist' && !tool) tool = 'm';

  if (s) return { start: s.start, end: s.end || Math.max(s.start, arr.length ? arr[arr.length - 1].ts : s.start), exact: !!s.end };

function fmtDur(min) {
  if (min < 1) return '—';
  const t = Math.round(min);
  if (t < 60) return t + ' min';
  return t % 60 ? `${Math.floor(t / 60)} h ${pad(t % 60)}` : `${t / 60} h`;
}
/* ---------- cronómetro para ejercicios por tiempo ---------- */
let swOn = false, swStart = 0, swIv = null;
const swSec = () => Math.floor((Date.now() - swStart) / 1000);
const fmtClock = (s) => hms(s);
function setTimeInputs(sec) {
  const f = $('#fr'); if (f) f.value = String(sec);
  const m = $('#ftm'), s = $('#fts');
  if (m) m.value = String(Math.floor(sec / 60));

}
function stopSW(fill) {
  if (!swOn) return;

/* ---------- pantalla encendida mientras registras ---------- */
let wl = null, wantWake = false;
async function wake(on) {
  wantWake = on;
  try {
    if (on && !wl && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    } else if (!on && wl) { await wl.release(); wl = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wantWake) wake(true); });

/* números con tope de cifras (4 enteras, 2 decimales): si se pasa, se deja como estaba */
function limNum(t) {
  const L = Number(t.dataset.lim), D = Number(t.dataset.dec || 0);
  const v = t.value.replace(D ? /[^0-9.,]/g : /[^0-9]/g, '');
  const ok = D ? new RegExp(`^\\d{0,${L}}([.,]\\d{0,${D}})?$`) : new RegExp(`^\\d{0,${L}}$`);
  if (ok.test(v)) { if (v !== t.value) t.value = v; t.dataset.pv = v; return; }
  const pv = t.dataset.pv ?? '', pos = Math.max(0, (t.selectionStart ?? t.value.length) - (t.value.length - pv.length));
  t.value = ok.test(pv) ? pv : '';
  try { t.setSelectionRange(pos, pos); } catch (err) { /* sin cursor */ }
}

  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d.parts || !d.routines || !d.logs) throw new Error();
      confirmS({ title: '¿Restaurar respaldo?', text: `Tus datos actuales se reemplazarán por los del archivo (${plural(d.logs.length, 'serie', 'series')}).`, cta: 'Restaurar', ok: () => { S = migrate(d); S.settings = Object.assign({ name: '', unit: 'kg', asked: true }, S.settings); save(); closeSheet(); toast('Respaldo restaurado'); } });
    } catch (err) { toast('Ese archivo no es un respaldo de GymRat'); }
  };
  rd.readAsText(file);
});

/* ---------- inicio ---------- */
async function boot() {
  if (!history.state) history.replaceState({ d: 0 }, '', location.hash || '#/');
  render();
  if (configured) {
    makeClient(remembered());
    try {
      const { data } = await sb.auth.getSession();
      if (data?.session?.user) { USER = data.session.user; await loadUserData(); }
    } catch (e) {}
  }
  booting = false;
  render();
  maybeOfferTour();
}
boot();
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
