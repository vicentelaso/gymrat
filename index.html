<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymRat">
<title>GymRat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;
  --s1:#141414;
  --s2:#222222;
  --line:#2c2c2c;
  --tx:#F5F3F0;
  --mu:#A39E98;
  --ac:#FF6A1F;
  --yl:#FFC53D;
  --red:#FF7A7A;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:'Barlow',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;min-height:100dvh;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,label{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 18px calc(env(safe-area-inset-bottom,0px) + 120px)}
.mu{color:var(--mu)}
.small{font-size:14px}
.grow{flex:1;min-width:0}
[hidden]{display:none!important}

/* barras superiores */
.top{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;white-space:nowrap;font-family:var(--cond);font-weight:800;font-size:24px;letter-spacing:.01em}
.tools{display:flex;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s1);flex:none}
.iconbtn.sm{width:40px;height:40px;border-radius:12px;background:var(--s2)}
.txtbtn{height:44px;padding:0 14px;border-radius:14px;background:var(--s1);font-weight:600;font-size:15px}
.install{height:44px;padding:0 12px;border-radius:14px;background:var(--ac);color:#000;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.hdr{display:flex;align-items:center;gap:8px;height:56px}
.hdr .ttl{flex:1;text-align:center;font-weight:600;font-size:15px;color:var(--mu);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hdr .sp{width:44px}

/* inicio */
.hello{color:var(--mu);font-size:18px;margin:26px 0 0}
h1.title{font-family:var(--cond);font-weight:800;font-size:52px;line-height:.92;margin:4px 0 22px;letter-spacing:-.005em}
.week{display:flex;gap:4px;width:100%;margin-bottom:26px;padding:0}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.wd i{width:34px;height:34px;border-radius:50%;background:var(--s1);display:grid;place-items:center;font-style:normal;font-size:14px;color:var(--mu);font-weight:500}
.wd.on i{background:var(--ac);color:#000;font-weight:700}
.wd.today i{box-shadow:inset 0 0 0 2px var(--tx);color:var(--tx)}
.wd.on.today i{color:#000}
.tiles{display:flex;flex-direction:column;gap:10px}
.tile{display:flex;align-items:center;gap:10px;width:100%;background:var(--yl);color:#000;border-radius:26px;padding:16px 14px 16px 22px;min-height:124px;transition:transform .12s ease}
.tile:active,.item .main:active,.row:active{transform:scale(.985)}
.tile .nm{display:block;font-family:var(--cond);font-weight:800;font-size:34px;line-height:.98}
.tile .sub{display:block;color:rgba(0,0,0,.66);font-size:14px;font-weight:500;margin-top:6px}
.tile .when{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;color:rgba(0,0,0,.66);border-top:1.5px solid rgba(0,0,0,.18);padding-top:6px}
.tag{display:inline-block;background:#000;color:var(--yl);font-weight:700;font-size:12px;letter-spacing:.03em;border-radius:999px;padding:4px 10px;margin-bottom:8px}
.fig{display:flex;gap:1px;flex:none}
.fig svg{display:block}
.figc{display:flex;flex-direction:column;align-items:center;gap:8px}
.figc small{color:var(--mu);font-size:12px;letter-spacing:.04em}
.hero{background:var(--s1);border-radius:26px;padding:20px 10px 14px;display:flex;justify-content:center;margin:8px 0 16px}
.hero .fig{gap:28px}
.alt-toggle{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mu);font-size:15px;padding:14px;margin:18px auto 0;min-height:44px}
.alts{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:var(--s1);border-radius:18px;min-height:60px;transition:transform .12s ease}
.row .rn{display:block;font-weight:600;font-size:17px}
.row .sub{display:block;color:var(--mu);font-size:14px}
.row.rt{background:var(--yl);color:#000;padding:8px 12px 8px 18px}
.row.rt .sub{color:rgba(0,0,0,.66)}
.addrow{background:none;border:1.5px dashed var(--line);color:var(--mu);justify-content:center;font-weight:600}
.empty{color:var(--mu);text-align:center;padding:26px 10px;font-size:15px;margin:0}

/* listas */
h2.pt{font-family:var(--cond);font-weight:800;font-size:44px;line-height:.95;margin:12px 0 8px}
.crumb{color:var(--mu);font-size:15px;margin:0 0 18px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:8px;background:var(--s1);border-radius:20px;min-height:72px;padding-right:12px}
.item .main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:14px 6px 14px 18px;align-self:stretch;transition:transform .12s ease}
.item .nm{display:block;font-family:var(--cond);font-weight:700;font-size:27px;line-height:1.05}
.item.ex{background:var(--ac);color:#000}
.item.ex .nm{font-family:inherit;font-weight:700;font-size:17px;line-height:1.25}
.item.ex .sub,.item.ex .meta{color:rgba(0,0,0,.68);font-weight:500}
.item.ex .chev{color:rgba(0,0,0,.5)}
.item.ex .badge{background:#000;color:var(--ac)}
.item.ex .iconbtn.sm{background:rgba(0,0,0,.14);color:#000}
.item.part .main{padding-left:12px}
.editbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--s1);border:1.5px solid var(--ac);border-radius:16px;padding:10px 10px 10px 14px;margin:0 0 12px;font-size:14px;color:var(--mu)}
.editbar .txtbtn{background:var(--ac);color:#000;flex:none}
.txtbtn.on{background:var(--ac);color:#000}
.item .sub{display:block;color:var(--mu);font-size:14px;margin-top:3px}
.item .meta{font-size:13px;color:var(--mu);white-space:nowrap;text-align:right}
.chev{color:#5a5752;display:grid}
.badge{background:var(--ac);color:#000;font-weight:700;font-size:14px;border-radius:999px;min-width:28px;height:28px;padding:0 9px;display:grid;place-items:center;flex:none}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;border:1.5px dashed var(--line);border-radius:20px;color:var(--mu);font-weight:600;margin-top:10px}

/* buscador y filtros */
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.search input{width:100%;height:52px;border-radius:16px;background:var(--s1);border:1.5px solid transparent;color:var(--tx);font-size:17px;padding:0 16px 0 46px;outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--ac)}
.fbar{display:flex;gap:8px;margin:0 0 10px}
.fbtn{display:flex;align-items:center;gap:10px;flex:1;min-height:50px;padding:0 14px;border-radius:16px;background:var(--s1);border:1.5px dashed #4a453f;color:var(--tx);font-size:15px;font-weight:600}
.fbtn svg:first-child{color:var(--ac)}
.fbtn.act{border:1.5px solid var(--ac);background:#2a1307}
.fbtn b{color:var(--ac)}
.fclr{width:50px;border-radius:16px;background:var(--s1);display:grid;place-items:center;color:var(--tx);flex:none}
.flist{background:var(--s1);border-radius:18px;padding:6px;margin:-2px 0 12px;display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line)}
.fopt{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:12px;font-size:16px}
.fopt i{width:20px;height:20px;border-radius:50%;border:2px solid #5a5550;flex:none}
.fopt.on{background:#2a1307}
.fopt.on i{border-color:var(--ac);box-shadow:inset 0 0 0 4px #2a1307;background:var(--ac)}
.fopt .fn{color:var(--mu);font-size:13px;background:#000;border-radius:999px;padding:2px 9px}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 12px;padding:0 18px 2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips .chip{flex:none}
.mdesc{background:var(--s1);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--mu);margin:0 0 12px;line-height:1.45}
.mdesc b{color:var(--tx)}

/* ejercicio */
.last{background:var(--s1);border-radius:20px;padding:16px 18px;font-size:16px;line-height:1.5;margin-bottom:12px}
.last b{color:var(--ac);font-weight:700}
.last .rec{display:block;color:var(--mu);font-size:14px;margin-top:6px}
.logger{background:var(--s1);border-radius:26px;padding:16px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.h3{font-weight:700;font-size:17px}
.seg{display:inline-flex;background:#000;border-radius:13px;padding:3px}
.seg button{text-align:center;padding:0 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mu);min-height:36px}
.seg button.on{background:var(--tx);color:#000}
.seg.wide{display:flex}
.seg.wide button{flex:1;min-height:44px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:block;background:#000;border-radius:18px;padding:10px 12px 8px;border:1.5px solid transparent;cursor:text}
.fld:focus-within{border-color:var(--ac)}
.fld span{display:block;color:var(--mu);font-size:14px}
.num{width:100%;background:none;border:0;color:var(--tx);font-family:var(--cond);font-weight:700;font-size:54px;padding:0;line-height:1.1;outline:none;-moz-appearance:textfield}
.num::placeholder{color:#3d3b38}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cta{display:grid;place-items:center;width:100%;height:60px;border-radius:18px;background:var(--ac);color:#000;font-weight:700;font-size:18px;margin-top:12px;transition:transform .1s}
.cta:active{transform:scale(.99)}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.set{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:14px;background:#000;min-height:52px}
.set .n{color:var(--mu);font-size:14px;width:56px;flex:none}
.set .v{font-family:var(--cond);font-size:24px;font-weight:700;white-space:nowrap}
.set .lb{color:var(--mu);font-size:14px}
.pr{color:var(--ac);font-size:12px;font-weight:700;border:1.5px solid var(--ac);border-radius:7px;padding:1px 6px}
.del{margin-left:auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mu);flex:none}
.card{background:var(--s1);border-radius:26px;padding:16px 16px 14px;margin-top:12px}
.chart svg{width:100%;height:auto;display:block;margin-top:6px}
.cinfo{font-size:15px;text-align:center;min-height:22px;margin:2px 0 0}
.cinfo{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;margin-top:4px}
.cinfo .cd{font-weight:600;font-size:15px}
.cinfo .cv{font-size:15px}
.cinfo .cx{font-size:13px;color:var(--mu)}
.cinfo b{color:var(--ac)}
.chelp{margin:0;font-size:13px;color:var(--mu)}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.notes.one{grid-template-columns:1fr}
.note{background:var(--s1);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.note .nl{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--mu);text-transform:uppercase;line-height:1.25}
.note .nd{font-size:13px;color:var(--mu)}
.note .nv{font-family:var(--cond);font-weight:800;font-size:28px;line-height:1.1;margin:4px 0 2px;color:var(--tx);white-space:nowrap}
.note .ns{font-size:13px;color:var(--mu)}
.note.best{box-shadow:inset 0 0 0 1.5px #3f7a48}
.note.best .nl{color:#7BE08A}
.nbest{display:flex;align-items:center;gap:6px;margin:0;background:#12301a;color:#7BE08A;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.nfirst{margin:0;background:var(--s1);border-radius:20px;padding:16px 18px}
.hnote{margin:0 0 6px;font-size:13px;color:var(--mu)}
.hrow .hs .hb{color:#7BE08A;font-weight:700}
.fld.opt{background:#0b0b0b}
.fld span i{font-style:normal;font-size:12px;color:#77726c}
.bwhint{margin:10px 2px 0;font-size:13px;color:var(--mu);line-height:1.4}
.fields.one{grid-template-columns:1fr}
.kmbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;min-height:46px;padding:0 14px;border-radius:14px;background:var(--s2);color:var(--tx);font-weight:600;font-size:15px;white-space:nowrap}
.kmbtn.add{background:none;border:1.5px dashed #4a453f;color:var(--tx)}
.kmbtn span{color:var(--mu);font-weight:500;font-size:13px;margin-left:2px}
.stopw{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;margin-top:10px;border-radius:16px;background:var(--s2);font-weight:600;font-size:16px}
.stopw.on{background:#12301a;color:#7BE08A}
.stopw b{font-family:var(--cond);font-size:26px;font-weight:800;min-width:64px;text-align:left}
.csum{margin:2px 0 0;font-size:14px;font-weight:600;color:var(--tx)}
.csum.up{color:#7BE08A}
.csum.down{color:var(--red)}
.csum span{color:var(--mu);font-weight:400}
.hist{margin-top:12px;background:var(--s1);border-radius:22px;padding:4px 16px}
.hist summary{list-style:none;padding:14px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:44px}
.hist summary::-webkit-details-marker{display:none}
.hrow{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hrow .hd{width:64px;color:var(--mu);flex:none}
.hrow .hs{display:flex;flex-wrap:wrap;gap:4px 12px}

/* barra fija de hoy */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(to bottom,rgba(0,0,0,0),#000 35%)}
.dock .in{max-width:524px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.dock .cta,.dock .btn2{margin:0;height:56px}

/* hoja inferior */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#ov.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#121212;border-radius:30px 30px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:50;visibility:hidden}
#sheet.on{transform:none;visibility:visible}
.shbar{position:sticky;top:-10px;z-index:3;display:flex;align-items:center;justify-content:center;height:46px;margin:-10px -20px 4px;background:#121212}
.grab{width:42px;height:5px;border-radius:3px;background:#3a3a3a}
.shx{position:absolute;right:12px;top:6px;width:36px;height:36px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--tx)}
.erhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.erhead .sh-t{margin-top:6px}
.sh-t{font-family:var(--cond);font-weight:800;font-size:32px;line-height:1;margin:0 0 14px}
.inp{width:100%;height:56px;border-radius:16px;background:#000;border:1.5px solid var(--line);color:var(--tx);font-size:17px;padding:0 16px;outline:none}
.inp:focus{border-color:var(--ac)}
.lbl{display:block;color:var(--mu);font-size:14px;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 16px;min-height:44px;border-radius:999px;background:#000;border:1.5px solid var(--line);font-size:15px;white-space:nowrap}
.fchips .chip{background:var(--s1);border-color:var(--s1)}
.chip.on,.fchips .chip.on{background:var(--ac);border-color:var(--ac);color:#000;font-weight:600}
.chip.add{border-style:dashed;color:var(--mu)}
.chips.yl .chip.on{background:var(--yl);border-color:var(--yl)}
.inrow{display:flex;gap:8px;margin-top:10px}
.inrow .btn2{width:auto;padding:0 18px;flex:none;height:56px;margin:0}
.btn2{display:grid;place-items:center;height:54px;border-radius:16px;background:var(--s2);font-weight:600;width:100%;margin-top:10px;cursor:pointer}
.btn2.danger{color:var(--red)}
.cta.dangerbg{background:var(--red)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:18px;padding:14px 16px;border-radius:16px;background:#000;border:1.5px solid var(--line)}
.switch small{display:block;color:var(--mu);font-size:14px}
.switch i{width:50px;height:30px;border-radius:15px;background:#3a3a3a;position:relative;flex:none;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch i.on{background:var(--ac)}
.switch i.on::after{transform:translateX(20px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn2{margin-top:0}
.steps{margin:0;padding-left:22px;line-height:1.7}

/* registro de hoy */
.tx{background:#000;border-radius:18px;padding:12px 8px 8px 14px;margin-bottom:8px}
.tx .tn{font-weight:600;padding-right:6px}
.tx .tm{color:var(--mu);font-size:14px}
.tx .set{background:none;padding-left:0;min-height:46px}

/* calendario */
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calh .sh-t{margin:0;text-align:center;flex:1;font-size:28px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;margin-top:14px}
.cal .dw{font-size:12px;color:var(--mu);padding:4px 0}
.cal button{aspect-ratio:1;border-radius:50%;font-size:15px;display:grid;place-items:center;max-width:46px;width:100%;margin:0 auto}
.cal button:disabled{color:#77736e;cursor:default}
.cal .tr{background:var(--ac);color:#000;font-weight:700}
.cal .td{box-shadow:inset 0 0 0 2px var(--tx)}
.cal .sel{outline:2px solid var(--tx);outline-offset:2px}
.calsub{text-align:center;color:var(--mu);font-size:14px;margin:4px 0 0}
.sum{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.sum-d{font-family:var(--cond);font-weight:700;font-size:26px;margin:0 0 10px}
.sum-r{background:#000;border-radius:18px;padding:14px 16px;margin-bottom:8px}
.sum-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.sum-h .rn{font-weight:700;font-size:17px}
.sum-x{padding:8px 0;border-top:1px solid #1f1f1f;font-size:15px}
.sum-x .sx{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mu);margin-top:2px}

/* estadísticas */
.iconbtn.inst{background:var(--ac);color:#000}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.scard{background:var(--s1);border-radius:20px;padding:14px 16px}
.scard b{display:block;font-family:var(--cond);font-weight:800;font-size:34px;line-height:1.05}
.scard span{color:var(--mu);font-size:13px}
.scard.hot{background:linear-gradient(135deg,#2a1307,var(--s1) 75%);box-shadow:inset 0 0 0 1.5px #4a2610}
.scard.hot b{color:var(--ac)}
.sblock{margin-top:12px}
.shl{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;margin-bottom:10px}
.shl svg{color:#7BE08A}
.srow{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:10px 0;border-top:1px solid var(--line)}
.srow span{color:var(--mu);font-size:14px}
.srow b{font-family:var(--cond);font-weight:800;font-size:22px;text-align:right}
.srow small{grid-column:1/-1;color:#8a857f;font-size:13px;margin-top:2px}
.sbar{margin-top:10px}
.sbl{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:5px}
.sbl b{font-weight:700;white-space:nowrap}
.sbt{height:10px;border-radius:6px;background:#000;overflow:hidden}
.sbt i{display:block;height:100%;border-radius:6px;background:var(--ac)}
.sbar.yl .sbt i{background:var(--yl)}
.ssub{margin:4px 0 0;color:#8a857f;font-size:12px}
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:140px;align-items:end}
.wb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wb i{width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:#3a3531;display:block}
.wb.top i{background:var(--ac)}
.wb em{font-style:normal;font-size:12px;color:var(--mu)}
.wb span{font-size:12px;color:var(--mu)}
.stop{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.stop .rk{width:26px;height:26px;border-radius:50%;background:var(--ac);color:#000;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.stop small{color:var(--mu);font-size:12px;white-space:nowrap}

/* resumen de un día */
.backlink{display:inline-flex;align-items:center;gap:4px;color:var(--mu);font-weight:600;font-size:15px;min-height:40px;margin:-4px 0 4px}
.dtitle{font-family:var(--cond);font-weight:800;font-size:40px;line-height:1;margin:2px 0 6px}
.dsub{margin:0 0 14px;color:var(--ac);font-weight:600}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dst{background:#000;border-radius:18px;padding:12px 14px}
.dst b{display:block;font-family:var(--cond);font-weight:800;font-size:30px;line-height:1.05}
.dst span{color:var(--mu);font-size:13px}
.dst.big{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,#2a1307,#000 70%);border:1.5px solid #4a2610;padding:14px 16px}
.dst.big em{font-style:normal;display:inline-flex;align-items:center;gap:5px;background:#12301a;color:#7BE08A;font-weight:700;font-size:14px;border-radius:999px;padding:6px 12px;white-space:nowrap}
.dst.big b{font-size:42px;color:var(--ac)}
.dst.pr b{color:#7BE08A}
.dst.cardio{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between}
.dst.cardio b{color:#FF5A5F}
.dnote{color:var(--mu);font-size:13px;margin:12px 2px 4px;line-height:1.4}
.dblock{margin-top:14px}
.dbh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dbn{font-family:var(--cond);font-weight:800;font-size:24px}
.dbt{color:var(--mu);font-size:13px;white-space:nowrap}
.dx{display:flex;gap:12px;align-items:flex-start;background:#000;border-radius:18px;padding:10px;margin-bottom:8px}
.dx .exic{width:56px;height:56px}
.dxn{font-weight:700;font-size:16px;line-height:1.25}
.dxm{color:var(--mu);font-size:13px;margin-top:1px}
.dxs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cs{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:10px;background:var(--s1);font-size:14px;font-weight:600;white-space:nowrap}
.cs i{font-style:normal;font-size:11px;color:var(--mu);background:#000;border-radius:6px;padding:1px 5px}
.cs.best{background:#12301a;color:#7BE08A;box-shadow:inset 0 0 0 1.5px #3f7a48}
.cs.best i{background:#0b1f11;color:#7BE08A}
.cs b{font-size:10px;color:#000;background:#7BE08A;border-radius:5px;padding:1px 5px}
.rord{display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;align-items:center;gap:10px;background:#000;border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px;font-weight:600}
.rnum{width:24px;height:24px;border-radius:50%;background:var(--yl);color:#000;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.rrow .iconbtn:disabled{opacity:.3}

/* resumen final */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.stat{background:#000;border-radius:18px;padding:14px 16px}
.stat b{display:block;font-family:var(--cond);font-size:38px;font-weight:800;line-height:1.05}
.stat span{color:var(--mu);font-size:14px}
.prrow{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.prrow b{color:var(--ac);white-space:nowrap}

/* acceso */
.login{display:flex;flex-direction:column;padding-top:9vh}
.lg-logo{display:flex;justify-content:center;margin-bottom:14px}
.login h1.title{text-align:center;margin:0 0 6px}
.lg-sub{text-align:center;margin:0 0 22px}
.lg-note{margin:12px 0 0}
.check{display:flex;align-items:center;gap:12px;margin:16px 0 0;min-height:44px;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ac);margin:0}
.err{color:var(--red);margin:12px 0 0;font-size:15px;text-align:center}
.cta:disabled{opacity:.6}
.acct{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#000;border:1.5px solid var(--line);border-radius:16px;padding:12px 12px 12px 16px}
.acct small{display:block;color:var(--mu);font-size:13px}
.txtbtn.danger{color:var(--red);background:var(--s2);flex:none}

/* íconos de ejercicios */
.exic{display:grid;place-items:center;width:62px;height:62px;border-radius:16px;background:#000;flex:none;overflow:hidden}
.exic.big{width:112px;height:112px;border-radius:24px;background:var(--s1)}
.sheet-ic,.erhead .exic.big{background:#000;width:100px;height:100px}
.item.ex .main{padding-left:8px}
.ptag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.02em;background:rgba(0,0,0,.16);color:#000;vertical-align:1px}
.exhead{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.exhead .ptag{margin:6px 0 0;background:var(--s2);color:var(--mu)}
.exdesc{margin:0;color:var(--mu);font-size:14px;line-height:1.4}
.pickh{display:flex;align-items:center;justify-content:space-between}
.txtbtn.sm{height:36px;padding:0 12px;font-size:14px;background:var(--s2);color:var(--tx)}
.posegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;max-height:330px;overflow-y:auto;padding:2px;margin-bottom:8px}
.pose{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 7px;border-radius:14px;background:#000;border:2px solid transparent;overflow:hidden}
.pose span{font-size:11px;line-height:1.15;color:var(--mu);text-align:center}
.pose.on span{color:var(--tx)}
.txtbtn.sm.wide{width:100%}
.exhint{margin:8px 2px 0;font-size:14px;color:var(--mu);line-height:1.4}
.exhint b{color:var(--tx)}
.inp.area{height:auto;padding:12px 16px;resize:vertical;line-height:1.4;font-family:inherit}
.pose.on{border-color:var(--ac)}
.item.ex.hid{background:#5c2a10}
.item.ex.hid .nm{color:#d9cfc7}
.item.ex.hid .sub,.item.ex.hid .meta{color:#b8a79b}
.item.ex.hid .ptag{background:rgba(255,255,255,.12);color:#e8ded6}
.item.ex.hid .exic{opacity:.55}
.item.ex.hid .iconbtn.sm{background:rgba(255,255,255,.12);color:var(--tx)}

/* diálogo de confirmación */
#dlg{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:24px}
#dlg.on{display:flex}
#dlg .dbg{position:absolute;inset:0;background:rgba(0,0,0,.7)}
#dlg .dbox{position:relative;width:100%;max-width:380px;background:#1a1a1a;border:1px solid var(--line);border-radius:26px;padding:22px 20px 18px;animation:pop .18s ease-out}
#dlg h3{font-family:var(--cond);font-weight:800;font-size:28px;line-height:1.05;margin:0 0 8px}
#dlg p{color:var(--mu);margin:0 0 18px;font-size:15px;line-height:1.45}
#dlg .dbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#dlg .dbtns .btn2,#dlg .dbtns .cta{margin:0;height:52px;font-size:16px}
@keyframes pop{from{opacity:0;transform:scale(.96)}}

/* avisos */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);background:var(--tx);color:#000;border-radius:16px;padding:12px 16px;font-weight:600;z-index:60;display:flex;gap:16px;align-items:center;width:max-content;max-width:calc(100% - 32px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#toast{visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s}
#toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#toast button{color:#C24A0C;font-weight:700;min-height:32px}

.view{animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<main id="app"><div id="view"></div></main>
<div id="dockwrap"></div>
<div id="ov" data-act="close"></div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="dlg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
'use strict';
/* ---------- utilidades ---------- */
const KEY = 'gymrat:v1';
const LB = 0.45359237;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const norm = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const slug = (s) => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || uid();
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const pd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const fLong = (s) => new Intl.DateTimeFormat('es-CL', { weekday: 'long', day: 'numeric', month: 'long' }).format(pd(s)).replace(',', '');
const fShort = (s) => new Intl.DateTimeFormat('es-CL', { day: 'numeric', month: 'short' }).format(pd(s)).replace('.', '');
const daysAgo = (s) => Math.round((pd(today()) - pd(s)) / 864e5);
const rel = (s) => { const n = daysAgo(s); return n === 0 ? 'Hoy' : n === 1 ? 'Ayer' : n < 7 ? `Hace ${n} días` : fShort(s); };
const nf = (n, d = 1) => Number(n).toLocaleString('es-CL', { maximumFractionDigits: d });
const kg = (n) => nf(n) + ' kg';
const parseNum = (v) => parseFloat(String(v).replace(',', '.'));
const inNum = (n) => String(Math.round(n * 100) / 100).replace('.', ',');
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;

const I = {
  back: '<path d="M15 5l-7 7 7 7"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  down: '<path d="M6 9l6 6 6-6"/>',

  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',

};
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const logo = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#FF6A1F"/><g transform="translate(6.5 6.5) scale(.87)"><g transform="rotate(-45 50 50)"><path d="M84 50 C 98 50, 100 62, 94 69 C 88 76, 80 74, 80 82" fill="none" stroke="#F2F3F5" stroke-width="6" stroke-linecap="round"/><rect x="12" y="26" width="12" height="48" rx="3" fill="#0B0C0E"/><rect x="24" y="34" width="7" height="32" rx="2" fill="#0B0C0E"/><rect x="31" y="45" width="38" height="10" fill="#0B0C0E"/><rect x="69" y="34" width="7" height="32" rx="2" fill="#0B0C0E"/><rect x="76" y="26" width="12" height="48" rx="3" fill="#0B0C0E"/></g></g></svg>`;

/* ---------- figura del cuerpo (frente y espalda) ---------- */
const E = (k, cx, cy, rx, ry) => [k, 'ellipse', { cx, cy, rx, ry }];
const M = (k, d) => [k, 'path', { d }];
const pair = (fn, x) => [fn(x), fn(60 - x)];
const FIG_COMMON_TOP = [E('base', 30, 10, 6.5, 8), ['base', 'rect', { x: 26.5, y: 16.5, width: 7, height: 6, rx: 2 }]];
const FIG_LIMBS = (up) => [
  ...pair((x) => E(up, x, 40, 3.8, 7.5), 13),
  ...pair((x) => E('fore', x, 56, 3.3, 8.5), 11),
  ...pair((x) => ['base', 'circle', { cx: x, cy: 67, r: 2.8 }], 10)
];
const FIG = {
  f: [
    ...FIG_COMMON_TOP,
    M('base', 'M20.5 59 L39.5 59 L37 70 L30 74 L23 70 Z'),
    ...pair((x) => E('delt', x, 28, 6, 5.5), 17),
    M('chest', 'M22 24 C26 23 29 23 29.4 24.5 L29.4 35 C26 37 21 36.5 19.5 33 C18.5 29 19.5 25.5 22 24 Z'),
    M('chest', 'M38 24 C34 23 31 23 30.6 24.5 L30.6 35 C34 37 39 36.5 40.5 33 C41.5 29 40.5 25.5 38 24 Z'),
    M('obl', 'M19.5 36 L23.5 38 L23.5 58 L20 55 C19 48 19 42 19.5 36 Z'),
    M('obl', 'M40.5 36 L36.5 38 L36.5 58 L40 55 C41 48 41 42 40.5 36 Z'),
    ...[0, 1, 2].flatMap((i) => [['abs', 'rect', { x: 24.3, y: 37.5 + i * 7, width: 5.2, height: 6.2, rx: 1.6 }], ['abs', 'rect', { x: 30.5, y: 37.5 + i * 7, width: 5.2, height: 6.2, rx: 1.6 }]]),
    M('abs', 'M24.3 58.5 L35.7 58.5 L32.5 67 L27.5 67 Z'),
    ...FIG_LIMBS('bi'),
    ...pair((x) => E('quads', x, 84, 6, 14), 24),
    ...pair((x) => ['base', 'circle', { cx: x, cy: 99.5, r: 3 }], 24),
    ...pair((x) => E('calves', x, 110, 3.8, 9), 24),
    ...pair((x) => E('base', x, 121, 3.5, 2), 24),
    M('heart', 'M33.6 36 C27.6 31.8 29.2 26 33.6 28.9 C38 26 39.6 31.8 33.6 36 Z')
  ],
  b: [
    ...FIG_COMMON_TOP,
    ...pair((x) => E('delt', x, 28, 6, 5.5), 17),
    M('lats', 'M24 27 L29.4 40 L29.4 52 C26 53 22.5 50 21 46 C19.5 41 19.5 33 20.5 29 Z'),
    M('lats', 'M36 27 L30.6 40 L30.6 52 C34 53 37.5 50 39 46 C40.5 41 40.5 33 39.5 29 Z'),
    M('traps', 'M30 18 C33 20 38 22 41.5 25.5 C37.5 27 33.5 31 30 41 C26.5 31 22.5 27 18.5 25.5 C22 22 27 20 30 18 Z'),
    ['lower', 'rect', { x: 25.5, y: 53, width: 9, height: 6.5, rx: 2 }],
    ...FIG_LIMBS('tri'),
    ...pair((x) => E('glutes', x, 66, 5.6, 6.5), 25),
    ...pair((x) => E('hams', x, 86, 5.8, 12.5), 24),
    ...pair((x) => ['base', 'circle', { cx: x, cy: 99.5, r: 3 }], 24),
    ...pair((x) => E('calves', x, 108, 4.3, 9), 24),
    ...pair((x) => E('base', x, 121, 3.5, 2), 24)
  ]
};
const TH = {
  yl: { base: 'rgba(0,0,0,.14)', mus: 'rgba(0,0,0,.24)', hi: '#D3121A', gap: '#FFC53D', heart: '#8B0015' },
  dk: { base: '#262626', mus: '#353535', hi: '#FF3B30', gap: '#141414', heart: '#FF0038' },
  sh: { base: '#262626', mus: '#353535', hi: '#FF3B30', gap: '#121212', heart: '#FF0038' }
};
const REG_RULES = [
  [/pech/, ['chest']], [/espald|dorsal/, ['lats', 'lower', 'traps']], [/hombr|deltoid/, ['delt', 'traps']],
  [/trapec/, ['traps']], [/bicep/, ['bi']], [/tricep/, ['tri']], [/antebraz/, ['fore']], [/brazo/, ['bi', 'tri', 'fore']],
  [/pierna/, ['quads', 'hams', 'glutes', 'calves']], [/cuadric/, ['quads']], [/isquio|femoral/, ['hams']],
  [/glute/, ['glutes']], [/cardio/, ['heart']], [/pantorr|gemel/, ['calves']], [/abdom|\babs\b|core/, ['abs', 'obl']], [/oblicu/, ['obl']], [/lumbar/, ['lower']]
];
function regsFor(pids) {
  const s = new Set();
  pids.forEach((id) => { const p = P(id); const n = norm((p ? p.name : '') + ' ' + id); REG_RULES.forEach(([re, rs]) => { if (re.test(n)) rs.forEach((r) => s.add(r)); }); });
  return s;
}
function body(regs, th, h, labels = false) {
  const w = Math.round((h * 60) / 124);
  const one = (arr, lab) => {
    const svg = `<svg viewBox="0 0 60 124" width="${w}" height="${h}" aria-hidden="true">${arr.map(([k, t, a]) => {
      if (k === 'heart') return regs.has('heart') ? `<path d="${a.d}" fill="${th.heart}" stroke="#fff" stroke-width="0.9" stroke-linejoin="round"/>` : '';

      return `<${t} ${Object.entries(a).map(([n, v]) => `${n}="${v}"`).join(' ')} fill="${fill}" stroke="${th.gap}" stroke-width="0.9"/>`;
    }).join('')}</svg>`;
    return labels ? `<span class="figc">${svg}<small>${lab}</small></span>` : svg;
  };
  return `<span class="fig">${one(FIG.f, 'Frente')}${one(FIG.b, 'Espalda')}</span>`;
}

/* ---------- íconos de ejercicios: postura + implemento + músculo ---------- */
const LEGS = (y = 56, k = 75, f = 94) => [['Th', 45, y, 44, k], ['S', 44, k, 44, f], ['Th', 55, y, 56, k], ['S', 56, k, 56, f]];

/* músculo del ejercicio -> zonas que se pintan en rojo */
function regsForMuscle(m, pid) {
  const n = norm(m || '');
  const s = new Set();
  const add = (...r) => r.forEach((x) => s.add(x));
  if (/pectoral|pecho/.test(n)) add('chest');
  if (/dorsal|espalda media/.test(n)) add('lats');
  if (/lumbar/.test(n)) add('lower');
  if (/deltoide|hombro/.test(n)) add('delt');
  if (/trapecio/.test(n)) add('traps');
  if (/bicep/.test(n)) add('bi');
  if (/braquial |braquial$|y antebrazo/.test(n)) add('fore', 'bi');
  if (/flexores|extensores|braquiorradial|agarre|antebrazo/.test(n)) add('fore');
  if (/cabeza|tricep/.test(n)) add('tri');
  if (/cuadricep/.test(n)) add('quads');
  if (/aductor/.test(n)) add('add');
  if (/isquio|femoral/.test(n)) add('hams');
  if (/glute|abductor/.test(n)) add('glutes');
  if (/pantorr|gemel/.test(n)) add('calves');
  if (/recto|core|abdom/.test(n)) add('abs');
  if (/cardio|aire libre|intervalos|hiit/.test(n)) add('heart');
  if (/oblicu/.test(n)) add('obl');
  if (!s.size && pid) return regsFor([pid]);
  return s;
}

function capsule(x1, y1, x2, y2, r1, r2, fill, extra = '') {
  const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
  return `<path d="M${fx(x1 + nx * r1)} ${fx(y1 + ny * r1)} L${fx(x2 + nx * r2)} ${fx(y2 + ny * r2)} L${fx(x2 - nx * r2)} ${fx(y2 - ny * r2)} L${fx(x1 - nx * r1)} ${fx(y1 - ny * r1)} Z" fill="${fill}"${extra}/>` +
    `<circle cx="${fx(x1)}" cy="${fx(y1)}" r="${r1}" fill="${fill}"${extra}/><circle cx="${fx(x2)}" cy="${fx(y2)}" r="${r2}" fill="${fill}"${extra}/>`;
}

    const [k] = e;
    if (k === 'l') back += (e[5] || 3) >= 4 ? L(e[1], e[2], e[3], e[4], e[5], IC.pad) + L(e[1], e[2] - (e[5] * 0.22), e[3], e[4] - (e[5] * 0.22), e[5] * 0.35, '#5d5650') : L(e[1], e[2], e[3], e[4], e[5] || 3, IC.eq);
    else if (k === 'f') back += `<ellipse cx="50" cy="${e[1] + 0.5}" rx="34" ry="2.4" fill="#000" opacity=".5"/>` + L(10, e[1], 90, e[1], 2, IC.floor);
    else if (k === 'c') back += C(e[1], e[2], e[3], IC.pad);
    else if (k === 'o') back += `<circle cx="${e[1]}" cy="${e[2]}" r="${e[3]}" fill="${IC.eqd}" stroke="${IC.eq}" stroke-width="2.4"/>` + C(e[1], e[2], 1.4, IC.eq);
    else if (k === 'r') back += `<rect x="${e[1]}" y="${e[2]}" width="${e[3]}" height="${e[4]}" rx="1.8" fill="${IC.pad}"/>`;
    else if (k === 'a') front += arrow(e[1], e[2], e[3], e[4]);
    else if (k === 'q') back += `<path d="M${e[1]} ${e[2]} Q${e[3]} ${e[4]} ${e[5]} ${e[6]}" fill="none" stroke="${IC.mark}" stroke-width="1.6"/>`;
    else if (k === 'cb') front += `<path d="M${e[1]} ${e[2]} C${e[3]} ${e[4]} ${e[5]} ${e[6]} ${e[7]} ${e[8]}" fill="none" stroke="${IC.eq}" stroke-width="2.4" stroke-linecap="round"/>`;
    else if (k === 'w') { let d = `M2 ${e[1]}`; for (let x = 2; x < 98; x += 12) d += ` q3 -4 6 0 t6 0`; front += `<path d="${d}" fill="none" stroke="#4f86b5" stroke-width="2" opacity=".85"/>`; }
    else if (k === 'rails') back += [e[1], e[2]].map((x) => L(x, 4, x, 94, 1.6, '#57524c') + L(x - 2.5, 4, x + 2.5, 4, 2, '#57524c')).join('');
    else if (k === 't') front += `<text x="${e[1]}" y="${e[2]}" text-anchor="middle" font-size="${String(e[3]).length > 2 ? 10 : 13}" font-weight="800" font-family="Arial,sans-serif" fill="${IC.mark}">${e[3]}</text>`;
    else if (k === 'dia') front += `<path d="M${e[1]} ${e[2] - 5} L${e[1] + 5} ${e[2]} L${e[1]} ${e[2] + 5} L${e[1] - 5} ${e[2]} Z" fill="none" stroke="${IC.mark}" stroke-width="1.8"/>`;
    else if (k === 'ca') {
      const [x1, y1, cx, cy, x2, y2] = e.slice(1), a = Math.atan2(y2 - cy, x2 - cx), kk = 4.2;
      front += `<path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" fill="none" stroke="${IC.mark}" stroke-width="1.8" stroke-dasharray="3 2.5"/><polygon points="${x2},${y2} ${fx(x2 - kk * Math.cos(a - 0.5))},${fx(y2 - kk * Math.sin(a - 0.5))} ${fx(x2 - kk * Math.cos(a + 0.5))},${fx(y2 - kk * Math.sin(a + 0.5))}" fill="${IC.mark}"/>`;
    }
    else if (k === 'rot') { const [x, y] = [e[1], e[2]]; front += `<path d="M${x - 10} ${y} A10 4 0 1 0 ${x + 10} ${y}" fill="none" stroke="${IC.mark}" stroke-width="2"/><polygon points="${x + 10},${y - 3.5} ${x + 13},${y + 1.5} ${x + 7},${y + 1.5}" fill="${IC.mark}"/>`; }
  });
  const hands = p.hands || [];
  // cables de polea
  if (tool === 'c') {
    const an = p.an || [[50, 2]];
    const from = p.cf ? [p.cf] : hands;
    const pulley = (a) => `<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="${IC.eqd}" stroke="${IC.eq}" stroke-width="1.8"/>` + C(a[0], a[1], 1, IC.eq);
    if (an.length === 1 && from.length > 1) {
      const mx = (from[0][0] + from[1][0]) / 2, my = (from[0][1] + from[1][1]) / 2;
      back += L(mx, my, an[0][0], an[0][1], 1.3, IC.cab) + pulley(an[0]);
    } else from.forEach((h, i) => { const a = an[i] || an[0]; back += L(h[0], h[1], a[0], a[1], 1.3, IC.cab) + pulley(a); });
  }
  // extremidades del lado lejano: más oscuras y detrás del tronco
  (p.L || []).forEach(([k0, x1, y1, x2, y2]) => {
    if (!k0.endsWith('2')) return;
    const k = k0.slice(0, -1), [r1, r2] = RAD[k];
    const on = (k === 'U' && (regs.has('bi') || regs.has('tri'))) || (k === 'F' && regs.has('fore')) || (k === 'Th' && (regs.has('quads') || regs.has('hams') || regs.has('add'))) || (k === 'S' && regs.has('calves'));
    back += capsule(x1, y1, x2, y2, r1 * 0.95, r2 * 0.95, on ? '#9e2a22' : '#8a837a');
    if (k === 'F') back += C(x2, y2, 2.3, '#77706a');
    if (k === 'S') { const l = Math.hypot(x2 - x1, y2 - y1) || 1; back += capsule(x2, y2, x2 + ((y2 - y1) / l) * 5.4, y2 - ((x2 - x1) / l) * 5.4, 2.3, 1.6, '#77706a'); }
  });
  // tronco
  if (p.t) {
    const [px, py, sx, sy] = p.t;
    const tx = sx - px, ty = sy - py, len = Math.hypot(tx, ty), ux = tx / len, uy = ty / len;
    const fl = p.fl || 1, nx = fl * -uy, ny = fl * ux;
    body += capsule(sx, sy, sx + (p.h[0] - sx) * 0.55, sy + (p.h[1] - sy) * 0.55, 2.8, 2.6, IC.body);
    body += capsule(px, py, sx, sy, 5.2, 6.3, IC.body);
    const band = (a1, a2, off, r = 2.3) => muscle(px + ux * len * a1 + nx * off, py + uy * len * a1 + ny * off, px + ux * len * a2 + nx * off, py + uy * len * a2 + ny * off, r, r);
    if (regs.has('chest')) band(0.64, 0.93, 3.3, 2.6);
    if (regs.has('abs')) band(0.1, 0.55, 3.1);
    if (regs.has('obl')) band(0.15, 0.6, 0, 2.6);
    if (regs.has('lats')) band(0.45, 0.9, -3.2, 2.5);
    if (regs.has('lower')) band(0.06, 0.38, -3.1);
    if (regs.has('traps')) band(0.9, 1.08, -2.5, 2.1);
    if (regs.has('glutes')) { red += C(px - nx * 2.6, py - ny * 2.6, 5.8, IC.hi) + C(px - nx * 3.3, py - ny * 3.3, 2.2, IC.hi2).replace('/>', ' opacity=".55"/>'); }
  }
  if (p.tf) {
    const [y1, y2] = p.tf, hgt = y2 - y1;
    body += capsule(50, y1 + 1, 50, y1 - 5, 3, 2.7, IC.body);
    body += `<path d="M39 ${y1 + 1} Q50 ${y1 - 2.5} 61 ${y1 + 1} L58 ${y2} Q50 ${y2 + 2.5} 42 ${y2} Z" fill="${IC.body}" stroke="${IC.body}" stroke-width="2.5" stroke-linejoin="round"/>`;
    const R = (x, y, w, h) => { red += `<rect x="${x}" y="${fx(y)}" width="${w}" height="${fx(h)}" rx="2" fill="${IC.hi}"/>`; };
    if (p.back) body += L(50, y1 + 3, 50, y2 - 3, 1.2, '#9f988f') + L(44, y1 + 5, 47, y1 + 11, 1, '#aaa39a') + L(56, y1 + 5, 53, y1 + 11, 1, '#aaa39a');
    if (regs.has('chest') && !p.back) { R(42, y1 + 2.5, 7.3, 8); R(50.7, y1 + 2.5, 7.3, 8); }
    if (regs.has('abs')) R(45.5, y1 + 12.5, 9, hgt - 14);
    if (regs.has('obl')) { R(42.3, y1 + 13, 2.9, hgt - 16); R(54.8, y1 + 13, 2.9, hgt - 16); }
    if (regs.has('lats')) { R(40.5, y1 + 4, 2.9, 13); R(56.6, y1 + 4, 2.9, 13); }
    if (regs.has('traps')) R(44, y1 - 2.8, 12, 3.8);
    if (regs.has('lower')) R(46, y2 - 6, 8, 4);
    if (regs.has('glutes')) red += C(45, y2, 4.4, IC.hi) + C(55, y2, 4.4, IC.hi);
  }
  if (regs.has('heart')) {
    let hx, hy;
    if (p.t) { const [px, py, sx, sy] = p.t; hx = px + (sx - px) * 0.72; hy = py + (sy - py) * 0.72; }
    else { hx = 50; hy = p.tf[0] + 8; }
    const hp = (s, fill, extra = '') => `<path d="M${fx(hx)} ${fx(hy + 3.2 * s)} C${fx(hx - 6 * s)} ${fx(hy - 1 * s)} ${fx(hx - 3 * s)} ${fx(hy - 5.5 * s)} ${fx(hx)} ${fx(hy - 2.4 * s)} C${fx(hx + 3 * s)} ${fx(hy - 5.5 * s)} ${fx(hx + 6 * s)} ${fx(hy - 1 * s)} ${fx(hx)} ${fx(hy + 3.2 * s)} Z" fill="${fill}"${extra}/>`;
    heartSvg = hp(1.35, '#FF0038', ' stroke="#fff" stroke-width="1"');
  }
  body += C(p.h[0], p.h[1], 6.4, IC.body);
  // extremidades con forma, manos y pies
  (p.L || []).forEach(([k, x1, y1, x2, y2]) => {
    if (k.endsWith('2')) return;
    const on = (k === 'U' && (regs.has('bi') || regs.has('tri'))) || (k === 'F' && regs.has('fore')) ||
      (k === 'Th' && (regs.has('quads') || regs.has('hams') || regs.has('add'))) || (k === 'S' && regs.has('calves'));
    const [r1, r2] = RAD[k];
    body += capsule(x1, y1, x2, y2, r1, r2, IC.body);
    if (on) muscle(x1, y1, x2, y2, r1 - 0.2, r2 - 0.2);
    if (k === 'F') body += C(x2, y2, 2.5, IC.body2);
    if (k === 'S') {
      let fdx, fdy;
      if (p.tf) { fdx = x2 < 50 ? -0.8 : 0.8; fdy = 0.6; }
      else { const l = Math.hypot(x2 - x1, y2 - y1) || 1; fdx = (y2 - y1) / l; fdy = -(x2 - x1) / l; }
      body += capsule(x2, y2, x2 + fdx * 5.6, y2 + fdy * 5.6, 2.4, 1.7, IC.body2);
    }
  });
  if (regs.has('delt')) (p.L || []).forEach(([k, x1, y1]) => { if (k === 'U' || (k === 'U2' && false)) red += C(x1, y1, 4.5, IC.hi) + C(x1 - 0.6, y1 - 0.8, 1.7, IC.hi2).replace('/>', ' opacity=".55"/>'); });
  // implemento en las manos
  const plate = (x, y, r) => `<circle cx="${fx(x)}" cy="${fx(y)}" r="${r}" fill="${IC.eqd}" stroke="${IC.eq}" stroke-width="2.4"/><circle cx="${fx(x)}" cy="${fx(y)}" r="${(r * 0.48).toFixed(1)}" fill="none" stroke="${IC.eq}" stroke-width="1"/>` + C(x, y, 1.4, IC.eq);
  if (tool === 'b') {
    if (hands.length > 1 || p.bar) {
      const xs = hands.map((h) => h[0]), y = hands.reduce((a, h) => a + h[1], 0) / hands.length;
      const x1 = Math.min(...xs) - 10, x2 = Math.max(...xs) + 10;
      front += (p.zbar ? `<polyline points="${x1},${y} ${x1 + 6},${y} ${x1 + 9},${y - 3} ${x1 + 12},${y + 2} ${x1 + 15},${y} ${x2 - 15},${y} ${x2 - 12},${y + 2} ${x2 - 9},${y - 3} ${x2 - 6},${y} ${x2},${y}" fill="none" stroke="${IC.eq}" stroke-width="2.4" stroke-linejoin="round"/>` : L(x1, y, x2, y, 2.4, IC.eq)) + `<rect x="${fx(x1 - 2.5)}" y="${fx(y - 7)}" width="5" height="14" rx="1.4" fill="${IC.eqd}" stroke="${IC.eq}" stroke-width="1.6"/><rect x="${fx(x2 - 2.5)}" y="${fx(y - 7)}" width="5" height="14" rx="1.4" fill="${IC.eqd}" stroke="${IC.eq}" stroke-width="1.6"/>`;
    } else hands.forEach((h) => { front += plate(h[0], h[1], 7.4); });
  } else if (tool === 'd') {
    if (p.dbv) hands.forEach((h) => { front += `<rect x="${h[0] - 2.2}" y="${h[1] - 8}" width="4.4" height="16" rx="1.6" fill="${IC.eqd}" stroke="${IC.eq}" stroke-width="1.6"/>`; });
    else hands.forEach((h) => { front += plate(h[0], h[1], 4.3); });
  } else if (tool === 'm' || tool === 'c') {
    if (p.bar && hands.length > 1) { const y = hands[0][1]; front += L(hands[0][0] - 6, y, hands[1][0] + 6, y, 3, IC.eq); }
    else if (tool === 'm') hands.forEach((h) => { front += L(h[0], h[1] - 5.5, h[0], h[1] + 5.5, 3.6, IC.eq); });
    else if (p.rope) hands.forEach((h) => { front += L(h[0], h[1] - 7, h[0] - 3, h[1] + 1, 2.2, IC.eq) + L(h[0], h[1] - 7, h[0] + 3, h[1] + 1, 2.2, IC.eq) + C(h[0] - 3, h[1] + 1.5, 1.6, IC.eq) + C(h[0] + 3, h[1] + 1.5, 1.6, IC.eq); });
    else hands.forEach((h) => { front += `<circle cx="${h[0]}" cy="${h[1]}" r="2.6" fill="none" stroke="${IC.eq}" stroke-width="1.6"/>`; });
  }
  if (mode === 'time') front += `<circle cx="86" cy="14" r="8" fill="#12301a" stroke="#7BE08A" stroke-width="1.8"/><path d="M86 9.5 L86 14 L89.5 16" fill="none" stroke="#7BE08A" stroke-width="1.8" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true"><defs><radialGradient id="${id}g" cx="50%" cy="46%" r="55%"><stop offset="0" stop-color="#2b2825"/><stop offset=".7" stop-color="#121110"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><filter id="${id}f" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.8"/></filter></defs>` +
    `<rect width="100" height="100" fill="url(#${id}g)"/>${back}${red ? `<g filter="url(#${id}f)" opacity=".85">${red}</g>` : ''}${body}${red}${heartSvg}${front}</svg>`;
}

      ['Dominadas asistidas en máquina', 'pullupa', 'm', 'Dominadas con las rodillas sobre una plataforma que te empuja hacia arriba. Clave: el peso es ayuda, así que tu progreso es ir bajándolo.'],
      ['Pullover en polea', 'cpull', 'c', 'También llamado jalón con brazos rectos: frente a la polea alta, baja la barra con los brazos estirados hasta los muslos. Clave: brazos casi rectos todo el recorrido; el movimiento es del hombro.'],
      ['Pullover con mancuerna', 'pullover', 'd', 'Acostado, sostén una mancuerna sobre el pecho y llévala en arco hacia atrás de la cabeza y de vuelta. Clave: codos levemente doblados y sin arquear la espalda.']]],
    ['Espalda media', 'Romboides y trapecio medio, entre los omóplatos. Dan grosor a la espalda y se trabajan con remos.', [
      ['Remo con barra', 'bentrow', 'b', 'Inclinado con la espalda recta y rodillas algo dobladas, tira la barra hacia el ombligo juntando los omóplatos. Clave: el torso no debe subir y bajar para ayudar.'],
      ['Remo con mancuerna', 'dbrow', 'd', 'Con una mano y una rodilla apoyadas en el banco, tira la mancuerna hacia la cadera. Clave: lleva el codo hacia atrás, no hacia arriba.'],
      ['Remo en polea baja', 'row', 'c', 'Sentado con los pies apoyados, tira el agarre hacia el abdomen sin balancear el torso. Clave: estira los brazos al volver para sentir el estiramiento de la espalda.'],
      ['Remo en máquina', 'rowmach', 'm', 'Con el pecho en el cojín, tira las manillas hacia atrás juntando los omóplatos. Clave: el cojín evita trampas; aguanta un segundo atrás.'],
      ['Remo en T con apoyo', 'tbarsup', 'b', 'Con el pecho sobre el cojín inclinado, tira las manillas de la barra en T hacia el pecho. Clave: no despegues el pecho del cojín.'],
      ['Remo en T libre', 'tbar', 'b', 'De pie sobre la barra en T, inclinado y con la espalda recta, tírala hacia el pecho. Clave: rodillas dobladas y espalda firme, como en un remo con barra.'],
      ['Remo en máquina unilateral', 'rowuni', 'm', 'Remo en máquina con un brazo a la vez. Clave: sirve para detectar y corregir diferencias de fuerza entre lados.'],
      ['Remo en polea agarre abierto', 'rowwide', 'c', 'Remo en polea baja con barra ancha, llevando los codos abiertos a la altura del pecho. Clave: enfoca la espalda alta y el deltoide posterior.'],
      ['Remo Pendlay', 'pendlay', 'b', 'Con el torso paralelo al suelo, tira la barra desde el piso hasta el pecho y déjala volver al suelo en cada repetición. Clave: tirón explosivo y espalda plana.'],
      ['Remo invertido', 'invrow', 'n', 'Colgado bajo una barra baja con el cuerpo recto, tira el pecho hacia la barra. Clave: mientras más horizontal el cuerpo, más difícil.'],
      ['Remo acostado en banco', 'sealrow', 'b', 'También llamado remo sello: boca abajo sobre un banco alto, tira la barra desde abajo hasta tocar el banco. Clave: al estar apoyado no puedes hacer trampa con la espalda baja.']]],
    ['Lumbar', 'La zona baja de la espalda. Sostiene la columna en casi todos los ejercicios pesados.', [
      ['Peso muerto', 'dlfloor', 'b', 'Con la barra sobre la mitad del pie, tómala, saca pecho y levántala estirando cadera y rodillas a la vez. Clave: la barra sube pegada a las piernas y la espalda nunca se redondea.'],
      ['Hiperextensiones', 'hyper', 'n', 'En el banco romano con la cadera en el cojín, baja el torso y súbelo hasta quedar en línea con las piernas. Clave: no subas más allá de la línea recta.'],
      ['Buenos días con barra', 'goodmorning', 'b', 'Con la barra en la espalda y las rodillas algo dobladas, inclina el torso adelante llevando la cadera atrás y vuelve. Clave: parte con poco peso; es un ejercicio exigente para la zona lumbar.'],
      ['Rack pull', 'rackpull', 'b', 'Peso muerto parcial desde soportes a la altura de la rodilla. Clave: permite más carga que el peso muerto completo y enfoca la parte final del tirón.']]]
  ] },
  { n: 'Hombros', muscles: [
    ['Deltoide anterior', 'La parte delantera del hombro. Trabaja en todos los press y al levantar el brazo hacia adelante.', [
      ['Press militar con barra', 'ohpress', 'b', 'De pie o sentado, empuja la barra desde la clavícula hasta sobre la cabeza. Clave: aprieta glúteos y abdomen para no arquear la espalda, y mete la cabeza al pasar la barra.'],
      ['Press con mancuernas', 'ohpress', 'd', 'Sentado con respaldo, empuja las mancuernas desde la altura de las orejas hasta arriba. Clave: no juntes las mancuernas arriba de golpe; mantén la tensión.'],
      ['Press en máquina', 'ohpress', 'm', 'Sentado en la máquina, empuja las manillas hacia arriba sin despegar la espalda. Clave: buena opción para ir pesado de forma segura.'],
      ['Press Arnold', 'arnold', 'd', 'Parte con las mancuernas frente a la cara y las palmas hacia ti, y gíralas mientras las empujas hacia arriba. Clave: el giro suma recorrido y trabajo para todo el hombro.'],
      ['Press en Smith', 'ohsmith', 'b', 'Press de hombros con la barra guiada por rieles, sentado en un banco. Clave: ubica el banco para que la barra baje frente a la cara, no detrás.'],
      ['Elevaciones frontales', 'frontraise', 'd', 'De pie, sube las mancuernas al frente con los brazos casi estirados hasta la altura de los hombros. Clave: sin balanceo; si necesitas impulso, baja el peso.'],
      ['Elevaciones frontales en polea', 'frontraise', 'c', 'Elevación frontal tomando la polea baja entre las piernas. Clave: la polea mantiene tensión también abajo.'],
      ['Elevación frontal con disco', 'frontraise', 'b', 'Sube un disco tomado con ambas manos al frente, hasta la altura de los ojos. Clave: brazos casi rectos y torso quieto.'],
      ['Press landmine', 'landmine', 'b', 'Con un extremo de la barra anclado en el suelo, empuja el otro extremo hacia arriba y adelante con una mano. Clave: es un press de hombro amable con las articulaciones.']]],
    ['Deltoide lateral', 'El costado del hombro. Es el que da ancho a los hombros.', [
      ['Elevaciones laterales', 'lateral', 'd', 'De pie, sube las mancuernas hacia los lados hasta la altura de los hombros, con los codos algo doblados. Clave: guía con los codos y no subas los hombros hacia las orejas.'],
      ['Elevaciones laterales en polea', 'latcable', 'c', 'De lado a la polea baja, sube el brazo hacia afuera tomando la manilla con la mano contraria a la polea. Clave: la tensión es constante, así que usa menos peso que con mancuernas.'],
      ['Elevaciones laterales en máquina', 'latmach', 'm', 'Sentado, empuja los cojines hacia arriba con la parte externa de los brazos. Clave: sube hasta la altura de los hombros y baja lento.'],
      ['Remo al mentón', 'uprow', 'b', 'Con la barra frente a los muslos, súbela pegada al cuerpo hasta el pecho con los codos altos. Clave: no subas más allá del pecho si te molesta el hombro.'],
      ['Remo al mentón en polea', 'uprow', 'c', 'Remo al mentón usando la polea baja con barra o cuerda. Clave: codos siempre por encima de las manos.']]],
    ['Deltoide posterior', 'La parte de atrás del hombro. Ayuda a la postura y suele quedar atrasado.', [
      ['Pájaros con mancuernas', 'reardelt', 'd', 'Inclinado hacia adelante con la espalda recta, abre los brazos hacia los lados como alas. Clave: pesos livianos y codos algo doblados; el movimiento es corto.'],
      ['Pájaros en polea', 'reardelt', 'c', 'Inclinado entre dos poleas bajas, tómalas cruzadas y abre los brazos hacia afuera. Clave: la polea da tensión en todo el recorrido.'],
      ['Face pull', 'facepull', 'c', 'Con la cuerda en la polea alta, tira hacia la cara separando las manos y subiendo los codos. Clave: termina con las manos junto a las orejas, como mostrando los bíceps.'],
      ['Peck deck invertido', 'revpeck', 'm', 'Sentado mirando hacia la máquina, abre los brazos hacia atrás. Clave: brazos casi rectos y sin juntar los omóplatos al final.'],
      ['Cruce de poleas invertido', 'revcross', 'c', 'De pie entre dos poleas a la altura del hombro, toma cada manilla con la mano contraria y abre los brazos hacia los lados. Clave: los cables se cruzan frente a ti y los brazos van casi rectos.'],
      ['Elevación Y en polea', 'yraise', 'c', 'Con las poleas bajas cruzadas, sube los brazos en diagonal hasta formar una Y sobre la cabeza. Clave: trabaja el hombro posterior y el trapecio bajo; usa poco peso.']]],
    ['Trapecio superior', 'Entre el cuello y el hombro. Se trabaja subiendo los hombros hacia las orejas.', [
      ['Encogimientos con mancuernas', 'shrugup', 'd', 'De pie con las mancuernas a los costados, sube los hombros hacia las orejas y baja lento. Clave: sube recto, sin girar los hombros.'],
      ['Encogimientos con barra', 'shrugup', 'b', 'Encogimientos sosteniendo una barra frente a los muslos. Clave: aguanta un segundo arriba.'],
      ['Encogimientos en máquina', 'shrugup', 'm', 'Encogimientos en máquina o Smith, subiendo solo los hombros. Clave: brazos estirados todo el tiempo.'],
      ['Paseo del granjero', 'farmer', 'd', 'Camina sosteniendo mancuernas pesadas a los costados, con el torso erguido. Clave: se anota el tiempo y el peso de cada mancuerna; entrena agarre, trapecio y core.']]]
  ] },
  { n: 'Bíceps', muscles: [
    ['Bíceps', 'La parte delantera del brazo. Dobla el codo y gira la muñeca hacia arriba.', [
      ['Curl con barra recta', 'curl', 'b', 'De pie con los codos pegados al cuerpo, sube la barra doblando los codos y baja lento. Clave: sin balancear el torso; los codos no se mueven hacia adelante.'],
      ['Curl con barra Z', 'curlZ', 'b', 'Curl con la barra de agarre ondulado. Clave: es más cómoda para las muñecas que la barra recta.'],
      ['Curl alterno', 'curlalt', 'd', 'Sube una mancuerna a la vez girando la palma hacia arriba mientras subes. Clave: el giro de la muñeca aprieta más el bíceps.'],
      ['Curl concentrado', 'curlconc', 'd', 'Sentado, con el codo apoyado en la cara interna del muslo, sube la mancuerna. Clave: no hay forma de hacer trampa; ideal para terminar la rutina.'],
      ['Curl inclinado', 'curlinc', 'd', 'Sentado en banco inclinado con los brazos colgando detrás del cuerpo, sube las mancuernas. Clave: estira mucho el bíceps; usa menos peso que de pie.'],
      ['Curl en polea', 'curl', 'c', 'De frente a la polea baja, sube la barra o manilla con los codos fijos. Clave: la polea mantiene tensión también abajo.'],
      ['Curl con dos poleas bajas', 'curl2low', 'c', 'De pie entre dos poleas bajas, parte con los brazos abajo y sube ambas manillas doblando los codos. Clave: codos quietos a los costados del cuerpo.', 'biceps_curl-con-dos-poleas'],
      ['Curl en poleas altas (doble bíceps)', 'curl2c', 'c', 'Con los brazos abiertos a la altura de los hombros, lleva las manillas de las poleas altas hacia la cabeza. Clave: los codos no bajan; es la pose de "doble bíceps".'],
      ['Curl predicador', 'preacher', 'b', 'Con la parte trasera de los brazos apoyada en el banco Scott, sube la barra. Clave: no estires los codos de golpe al bajar.'],
      ['Curl predicador en máquina', 'preacher', 'm', 'Curl en máquina con apoyo para los brazos. Clave: muy controlado; buena opción para ir al fallo con seguridad.'],
      ['Curl predicador con mancuerna', 'preacher', 'd', 'Curl en banco Scott con una mancuerna, un brazo a la vez. Clave: sirve para emparejar un brazo más débil.'],
      ['Curl araña', 'spider', 'b', 'Boca abajo en banco inclinado con los brazos colgando vertical, sube la barra. Clave: trabaja mucho la parte alta del recorrido.'],
      ['Curl 21', 'curl21', 'b', 'Siete repeticiones de la mitad baja, siete de la mitad alta y siete completas, sin pausa. Clave: usa bastante menos peso que en un curl normal.'],
      ['Curl bayesiano en polea', 'bayes', 'c', 'De espaldas a la polea baja, con el brazo estirado detrás del cuerpo, sube la manilla doblando el codo. Clave: parte con el bíceps muy estirado, lo que lo hace muy efectivo.']]],
    ['Braquial y antebrazo', 'El músculo bajo el bíceps y la parte alta del antebrazo. Dan grosor al brazo; se trabajan con agarre neutro.', [
      ['Curl martillo', 'hammer', 'd', 'Curl con las palmas mirándose entre sí, como sosteniendo un martillo. Clave: da grosor al brazo; puedes alternar o subir ambas.'],
      ['Curl invertido', 'curlrev', 'b', 'Curl con las palmas hacia abajo. Clave: trabaja más el antebrazo; usa menos peso que en el curl normal.'],
      ['Curl martillo en polea con cuerda', 'curlrope', 'c', 'Curl martillo con la cuerda enganchada en la polea baja. Clave: separa un poco las puntas de la cuerda arriba.'],
      ['Curl de muñeca', 'wrist', 'b', 'Sentado con los antebrazos sobre los muslos, sube la barra doblando solo las muñecas. Clave: recorrido completo y lento; son músculos chicos.'],
      ['Colgarse de la barra', 'hang', 'n', 'Cuélgate de la barra con los brazos estirados el mayor tiempo posible. Clave: entrena el agarre; anota los segundos que aguantas.']]]
  ] },
  { n: 'Tríceps', muscles: [
    ['Cabeza larga', 'La parte interna y trasera del tríceps, la más grande. Se estira al llevar el brazo sobre la cabeza.', [
      ['Extensión con mancuerna', 'ohext2', 'd', 'Sentado, sostén una mancuerna con ambas manos sobre la cabeza, bájala detrás de la nuca y súbela. Clave: codos apuntando al techo, sin abrirse.'],

      ['Extensión en polea sobre la cabeza', 'ohext', 'c', 'De espaldas a la polea, estira los brazos hacia adelante y arriba desde detrás de la cabeza. Clave: gran estiramiento de la cabeza larga.'],
      ['Press francés', 'skull', 'b', 'Acostado, baja la barra hacia la frente doblando solo los codos y vuelve a estirar. Clave: brazos quietos; si se mueven, se vuelve un press.'],
      ['Press francés con mancuernas', 'skull', 'd', 'Press francés con una mancuerna en cada mano. Clave: más cómodo para los codos que la barra.']]],

      ['Extensión con barra', 'pushdown', 'c', 'Frente a la polea alta, empuja la barra hacia abajo con los codos pegados al cuerpo. Clave: permite más peso que la cuerda.'],
      ['Extensión unilateral en polea', 'pduni1', 'c', 'Extensión en polea alta con una manilla, un brazo a la vez. Clave: sirve para concentrarte en cada brazo.'],
      ['Press cerrado', 'benchclose', 'b', 'Press banca con las manos al ancho de los hombros y los codos pegados al cuerpo. Clave: la barra baja a la parte baja del pecho.'],
      ['Fondos en banco', 'dipbench', 'n', 'Con las manos en un banco detrás de ti y las piernas estiradas, baja doblando los codos y sube. Clave: espalda pegada al banco.'],
      ['Fondos para tríceps en máquina', 'dipmach', 'm', 'Sentado con el torso recto, empuja las manillas hacia abajo hasta estirar los brazos. Clave: el torso recto enfoca el trabajo en los tríceps.'],
      ['Patada de tríceps', 'tkick', 'd', 'Inclinado y con el codo pegado al cuerpo, estira el brazo hacia atrás. Clave: el brazo no se mueve, solo el antebrazo.'],
      ['Patada de tríceps en polea', 'tkick', 'c', 'Patada de tríceps usando la polea baja. Clave: tensión constante incluso con el brazo estirado.'],
      ['Flexiones diamante', 'pushdia', 'n', 'Flexiones con las manos juntas formando un rombo bajo el pecho. Clave: codos pegados al cuerpo al bajar.']]]
  ] },
  { n: 'Piernas', muscles: [

      ['Sentadilla frontal', 'frontsquat', 'b', 'Sentadilla con la barra apoyada adelante, sobre los hombros, y los codos altos. Clave: el torso va más vertical y carga más el cuádriceps.'],

      ['Sentadilla en Smith', 'squatsmith', 'b', 'Sentadilla con la barra guiada por rieles. Clave: adelanta un poco los pies para bajar más cómodo.'],
      ['Prensa', 'legpress', 'm', 'Sentado en la prensa inclinada, baja la plataforma doblando las rodillas y empújala. Clave: no bloquees las rodillas arriba ni despegues la zona lumbar abajo.'],
      ['Prensa horizontal sentado', 'legpressH', 'm', 'La seated leg press: sentado con la espalda apoyada, empuja la plataforma hacia adelante. Clave: pies al ancho de la cadera en la mitad de la plataforma.'],
      ['Prensa unilateral', 'legpressuni', 'm', 'Prensa empujando con una pierna a la vez. Clave: sirve para emparejar diferencias entre piernas.'],
      ['Sentadilla hack', 'hack', 'm', 'Con la espalda en el respaldo inclinado y los hombros bajo los cojines, baja y sube. Clave: pies algo adelantados; muy enfocada en el cuádriceps.'],
      ['Sentadilla péndulo', 'pendulum', 'm', 'Máquina de sentadilla con movimiento en arco. Clave: permite bajar mucho con la espalda apoyada.'],
      ['Extensión de cuádriceps', 'legext', 'm', 'Sentado en la máquina, estira las rodillas levantando el cojín con los tobillos. Clave: aprieta un segundo arriba y baja lento.'],
      ['Sentadilla búlgara', 'bulgarian', 'd', 'Con el pie de atrás apoyado en un banco, baja doblando la rodilla de adelante. Clave: la mayor parte del peso va en la pierna de adelante.'],
      ['Estocadas', 'lunge', 'd', 'Da un paso largo al frente y baja hasta que ambas rodillas formen 90°; vuelve. Clave: torso erguido y la rodilla de atrás casi toca el suelo.'],
      ['Estocadas caminando', 'walklunge', 'd', 'Estocadas avanzando, alternando las piernas en cada paso. Clave: pasos largos y controlados.'],
      ['Zancada inversa', 'revlunge', 'd', 'Estocada dando el paso hacia atrás. Clave: es más amable con las rodillas que la estocada hacia adelante.'],

      ['Sentadilla isométrica en pared', 'wallsit', 'n', 'Con la espalda apoyada en la pared, baja hasta que los muslos queden paralelos al suelo y mantén. Clave: anota los segundos que aguantas.']]],
    ['Isquiotibiales', 'La parte trasera del muslo. Dobla la rodilla y ayuda a extender la cadera.', [
      ['Curl femoral acostado', 'legcurl', 'm', 'Boca abajo en la máquina, lleva los talones hacia los glúteos. Clave: la cadera no se despega del banco.'],
      ['Curl femoral sentado', 'seatcurl', 'm', 'Sentado con el cojín sobre los muslos, lleva los talones hacia abajo y atrás. Clave: inclina el torso levemente adelante para más estiramiento.'],
      ['Curl femoral de pie', 'standcurl', 'm', 'De pie en la máquina, dobla una rodilla llevando el talón hacia el glúteo. Clave: una pierna a la vez, sin mover la cadera.'],
      ['Peso muerto rumano', 'rdl', 'b', 'Con las rodillas casi estiradas, baja la barra por los muslos llevando la cadera hacia atrás, y sube. Clave: baja hasta sentir el estiramiento en la parte trasera del muslo, con la espalda recta.'],
      ['Peso muerto rumano con mancuernas', 'rdl', 'd', 'Peso muerto rumano con una mancuerna en cada mano. Clave: mancuernas pegadas a las piernas.'],
      ['Peso muerto piernas rígidas', 'sldl', 'b', 'Como el rumano, pero con las piernas más estiradas y bajando más. Clave: requiere buena flexibilidad; no redondees la espalda.'],
      ['Nordic curl', 'nordic', 'n', 'De rodillas con los tobillos sujetos, deja caer el cuerpo recto hacia adelante lo más lento posible. Clave: es muy exigente; usa las manos para frenar abajo.']]],
    ['Glúteos', 'La musculatura de la cadera y el trasero. Extiende y abre la cadera.', [

      ['Hip thrust en máquina', 'hipthrust', 'm', 'Hip thrust en máquina, con el cinturón o cojín sobre la cadera. Clave: más cómodo de preparar que con barra.'],
      ['Puente de glúteo', 'bridge', 'n', 'Acostado en el suelo con las rodillas dobladas, sube la cadera apretando los glúteos. Clave: empuja con los talones.'],
      ['Patada de glúteo en polea', 'kickback', 'c', 'Con la tobillera en la polea baja, lleva la pierna estirada hacia atrás. Clave: sin arquear la espalda baja.'],
      ['Patada de glúteo en máquina', 'kickback', 'm', 'En la máquina de glúteo, empuja la plataforma hacia atrás con una pierna. Clave: aprieta arriba un segundo.'],
      ['Abducción en máquina', 'abduct', 'm', 'Sentado, abre las piernas empujando los cojines que están por fuera de las rodillas. Clave: inclinarse un poco adelante carga más el glúteo.'],
      ['Abducción de cadera en polea', 'hipabd', 'c', 'De pie con la tobillera en la polea baja, lleva la pierna estirada hacia el lado. Clave: tórax quieto; el movimiento es solo de la cadera.'],
      ['Peso muerto sumo', 'sumodl', 'b', 'Peso muerto con las piernas muy abiertas y las manos por dentro de las rodillas. Clave: suma glúteos y aductores; torso más vertical que el convencional.']]],
    ['Aductores', 'La cara interna del muslo. Juntan las piernas.', [
      ['Aducción en máquina', 'adduct', 'm', 'Sentado, cierra las piernas empujando los cojines que están por dentro de las rodillas. Clave: vuelve lento, sin dejar que el peso te abra de golpe.'],
      ['Sentadilla sumo', 'sumosq', 'd', 'Sentadilla con los pies muy abiertos, las puntas hacia afuera y una mancuerna colgando al centro. Clave: rodillas hacia afuera, en la dirección de los pies.']]],
    ['Pantorrillas', 'Gemelos y sóleo, en la parte trasera de la pierna bajo la rodilla.', [

const RENAMED = { 'biceps_curl-con-dos-poleas': 'Curl con dos poleas' };
const TOOL_FIX = { 'abdominales_elevacion-de-piernas-en-paralelas': ['m', 'n'] };
const POSE_FIX = { 'biceps_curl-con-dos-poleas': ['curl2c', 'curl2low'], 'abdominales_elevacion-de-piernas': ['legraise', 'legraiseL'] };
function seedParts() {
  return CATALOG.map((p) => {
    const pid = slug(p.n);
    return {
      id: pid, name: p.n,
      muscles: p.muscles.map(([n, d]) => ({ n, d })),
      ex: p.muscles.flatMap(([m, , exs]) => exs.map(([e, pose, tool, desc, fid]) => { const o = { id: fid || pid + '_' + slug(e), name: e, m, pose, tool, desc }; if (MODES[e]) o.mode = MODES[e]; return o; }))
    };
  });
}
function seed() {
  return {
    v: 2, cv: CATALOG_V, removed: [], parts: seedParts(),
    routines: [
      { id: 'r1', name: 'Espalda y bíceps', parts: ['espalda', 'biceps'], fav: true },
      { id: 'r2', name: 'Hombro y tríceps', parts: ['hombros', 'triceps'], fav: true },

      { id: 'r5', name: 'Full body', parts: ['pecho', 'espalda', 'piernas', 'hombros'], fav: false },

/* pasa los datos de la versión con "tipos" a la versión con músculos, sin perder series */
function migrate(s) {
  if (s.v >= 2) return mergeCatalog(s);
  const fresh = seedParts();
  const remap = {};
  const parts = s.parts.map((op) => {
    let np = fresh.find((p) => p.id === op.id);
    if (!np) np = { id: op.id, name: op.name, muscles: [], ex: [] };
    (op.types || []).forEach((t) => {
      t.ex.forEach((e) => {
        const hit = np.ex.find((x) => norm(x.name) === norm(e.name));
        if (hit) remap[e.id] = hit.id;
        else {
          if (!np.muscles.some((m) => m.n === t.name)) np.muscles.push({ n: t.name, d: '' });
          np.ex.push({ id: e.id, name: e.name, m: t.name });
        }
      });
    });
    return np;
  });
  fresh.forEach((p) => { if (!parts.some((x) => x.id === p.id)) parts.push(p); });
  s.logs.forEach((l) => { if (remap[l.x]) l.x = remap[l.x]; });
  s.parts = parts;
  s.v = 2;
  return mergeCatalog(s);
}
/* suma ejercicios nuevos del catálogo y marca como personalizados los que agregó el usuario */
function mergeCatalog(s) {
  s.removed = s.removed || [];
  const fresh = seedParts();
  const known = new Set();
  if ((s.cv || 0) < CATALOG_V) {
    fresh.forEach((fp) => {
      let up = s.parts.find((p) => p.id === fp.id);
      if (!up) { s.parts.push(fp); fp.ex.forEach((e) => known.add(e.id)); return; }
      fp.muscles.forEach((m) => { const um = up.muscles.find((x) => norm(x.n) === norm(m.n)); if (!um) up.muscles.push(m); else if (!um.d) um.d = m.d; });
      fp.ex.forEach((fe) => {
        const ue = up.ex.find((x) => x.id === fe.id || norm(x.name) === norm(fe.name));
        if (ue) {
          if (ue.id === fe.id && RENAMED[fe.id] && norm(ue.name) === norm(RENAMED[fe.id])) { const old = ue.name; ue.name = fe.name; s.logs.forEach((l) => { if (l.x === ue.id && l.name === old) l.name = fe.name; }); }
          if (POSE_FIX[fe.id] && ue.id === fe.id && (!ue.pose || ue.pose === POSE_FIX[fe.id][0])) ue.pose = POSE_FIX[fe.id][1];
          if (TOOL_FIX[fe.id] && ue.id === fe.id && ue.tool === TOOL_FIX[fe.id][0]) ue.tool = TOOL_FIX[fe.id][1];
          if (fe.mode && !ue.mode) ue.mode = fe.mode;
          if ((s.cv || 0) < 8 && ue.custom !== true) { if (!ue.poseSet) ue.pose = fe.pose; if (!ue.descSet) ue.desc = fe.desc; }
          ue.pose = ue.pose || fe.pose; ue.tool = ue.tool || fe.tool; ue.m = ue.m || fe.m; ue.desc = ue.desc || fe.desc; ue.custom = false; known.add(ue.id);
        }
        else { if (s.removed.includes(fe.id)) fe.hidden = true; up.ex.push(fe); known.add(fe.id); }
      });
    });
    s.parts.forEach((p) => p.ex.forEach((e) => { if (!known.has(e.id) && e.custom === undefined) e.custom = true; }));
    if ((s.cv || 0) < 9 && !s.routines.some((r) => r.id === 'rcardio' || norm(r.name) === 'cardio')) s.routines.push({ id: 'rcardio', name: 'Cardio', parts: ['cardio'], fav: false });
    s.removed = [];
    s.cv = CATALOG_V;
  }
  return s;
}

const P = (id) => S.parts.find((p) => p.id === id);
const R = (id) => S.routines.find((r) => r.id === id);
function X(xid) { for (const p of S.parts) { const e = p.ex.find((e) => e.id === xid); if (e) return { p, e }; } return null; }
const byTs = (a, b) => a.ts - b.ts;
function byDay(logs) {
  const m = {};
  logs.forEach((l) => (m[l.d] || (m[l.d] = [])).push(l));
  return Object.keys(m).sort().map((d) => ({ d, sets: m[d].sort(byTs) }));
}
/* mejor serie: la de mayor 1RM estimado (fórmula de Epley: peso × (1 + reps / 30)); si empatan, la de más repeticiones */
const rm1 = (s) => s.kg * (1 + s.reps / 30);
/* cómo se mide cada ejercicio:
   kg     peso × repeticiones (lo normal)
   bw     peso corporal: repeticiones + lastre opcional (implemento "n")
   time   por tiempo: segundos (se guardan en "reps") + peso extra opcional
   assist asistido en máquina: el peso es ayuda, menos es mejor */
let bwCache = null;
const kindOf = (xid) => {
  if (!bwCache) {
    bwCache = new Map();
    (S?.parts || []).forEach((p) => p.ex.forEach((e) => bwCache.set(e.id, e.mode === 'cardio' ? 'cardio' : e.mode === 'time' ? 'time' : e.mode === 'assist' ? 'assist' : e.tool === 'n' ? 'bw' : 'kg')));
  }
  return bwCache.get(xid) || 'kg';
};
const isBW = (xid) => kindOf(xid) === 'bw';
const bodyKg = () => { const b = parseNum(S?.settings?.bw); return b > 20 && b < 300 ? b : 70; };
const kmh = (s) => (s.km > 0 && s.reps > 0 ? s.km / (s.reps / 60) : 0);
const fmtT = (sec) => sec < 60 ? `${sec} s` : `${Math.floor(sec / 60)}:${pad(sec % 60)} min`;
/* puntaje para decidir la mejor serie:
   kg     1RM estimado
   bw     (tu peso + lastre) × (1 + reps/30)
   assist (tu peso − ayuda) × (1 + reps/30)
   time   segundos × (tu peso + peso extra) / tu peso */
const score = (s) => {
  const k = s.x ? kindOf(s.x) : 'kg', B = bodyKg();
  const v = k === 'bw' ? (B + s.kg) * (1 + s.reps / 30)
    : k === 'assist' ? Math.max(B - s.kg, 1) * (1 + s.reps / 30)
    : k === 'time' ? s.reps * (B + s.kg) / B
    : k === 'cardio' ? ((s.km || 0) > 0 ? 1000 + (s.km * 100) : 0) + s.reps / 1000
    : rm1(s);
  return v + s.reps * 1e-6;
};
const setTxt = (s, short = false) => {
  const k = kindOf(s.x);
  if (k === 'bw') return s.kg > 0 ? `${s.reps} reps + ${nf(s.kg)} kg` : `${s.reps} reps`;
  if (k === 'time') return s.kg > 0 ? `${fmtT(s.reps)} + ${nf(s.kg)} kg` : fmtT(s.reps);
  if (k === 'cardio') return s.km > 0 ? `${s.reps} min · ${nf(s.km, 2)} km` : `${s.reps} min`;
  if (k === 'assist') return s.kg > 0 ? (short ? `${s.reps} (ayuda ${nf(s.kg)})` : `${s.reps} reps, ayuda ${nf(s.kg)} kg`) : `${s.reps} reps sin ayuda`;
  return short ? `${nf(s.kg)} × ${s.reps}` : `${nf(s.kg)} kg × ${s.reps}`;
};
/* kilos levantados: no cuentan la ayuda de las máquinas asistidas ni los ejercicios por tiempo */
const volKg = (l) => { const k = kindOf(l.x); return k === 'kg' || k === 'bw' ? l.kg * l.reps : 0; };
const topSet = (sets) => sets.reduce((b, s) => (!b || score(s) > score(b) + 1e-12 ? s : b), null);
const isBest = (s, sets) => { const t = topSet(sets); return Math.abs(score(s) - score(t)) < 1e-9; };

/* rutina que toca, siguiendo el orden de las favoritas (Ajustes → Orden de tus rutinas):
   - si haces la que toca, toca la siguiente
   - si te saltas la que toca una vez, sigue sugiriéndose esa misma
   - si la vuelves a saltar, se retoma el orden desde la última que hiciste
   - si recuperas la saltada, se sigue desde la que habías hecho en su lugar
   Las rutinas alternativas (no favoritas) no cuentan. */
function nextRoutineId() {
  const favs = S.routines.filter((r) => r.fav);
  if (favs.length < 2) return null;
  const pos = (id) => favs.findIndex((r) => r.id === id);
  const next = (id) => favs[(pos(id) + 1) % favs.length].id;
  const seen = new Map();
  S.logs.slice().sort(byTs).forEach((l) => { const k = l.d + '|' + l.r; if (!seen.has(k)) seen.set(k, l.r); });
  let toca = favs[0].id, skips = 0, from = null, first = true;
  for (const rid of seen.values()) {
    if (pos(rid) < 0) continue;
    if (first) { toca = next(rid); first = false; continue; }
    if (rid === toca) { toca = from ? next(from) : next(rid); if (toca === rid) toca = next(rid); from = null; skips = 0; }
    else if (++skips === 1) from = rid;
    else { toca = next(rid); from = null; skips = 0; }
  }
  return toca;
}

  const longest = timed.reduce((b, d) => (!b || dayMin[d] > dayMin[b] ? d : b), null);
  /* las semanas se cuentan desde tu primer entrenamiento (o desde el inicio del período si empezaste antes) */
  const firstEver = S.logs.reduce((m, l) => (l.d < m ? l.d : m), today());
  const firstD = firstEver > since ? firstEver : since;
  const weeks = Math.max(1, ((pd(today()) - pd(firstD)) / 864e5 + 1) / 7);
  const perWeek = dates.length / weeks;
  const wd = [0, 0, 0, 0, 0, 0, 0];
  dates.forEach((d) => { wd[(pd(d).getDay() + 6) % 7]++; });
  const rc = {};
  sessions.forEach((s) => { const o = rc[s.r] || (rc[s.r] = { r: s.r, n: 0, last: '', min: 0, name: R(s.r)?.name || s.arr[0].rn || 'Rutina' }); o.n++; o.min += s.min; if (s.d > o.last) o.last = s.d; });
  const routines = Object.values(rc).sort((a, b) => b.n - a.n);
  const pc = {};
  logs.forEach((l) => { const f = X(l.x); const k = f ? f.p.name : 'Otros'; pc[k] = (pc[k] || 0) + 1; });
  const parts = Object.entries(pc).sort((a, b) => b[1] - a[1]);

  allW.forEach((w) => { run = prev && (pd(w) - pd(prev)) / 864e5 === 7 ? run + 1 : 1; best = Math.max(best, run); prev = w; });
  let cur = 0; { let w = wk(today()); const set = new Set(allW); if (!set.has(w)) { const t = pd(w); t.setDate(t.getDate() - 7); w = iso(t); } while (set.has(w)) { cur++; const t = pd(w); t.setDate(t.getDate() - 7); w = iso(t); } }
  const starts = sessions.map((s) => { const d = new Date(s.start); return d.getHours() * 60 + d.getMinutes(); });

    wd, routines, parts, exs, sets: logs.length, vol: logs.reduce((a, l) => a + volKg(l), 0), prs: logs.filter((l) => l.pr).length,
    cur, best, avgStart, cMin: cardio.reduce((a, l) => a + l.reps, 0), cKm: cardio.reduce((a, l) => a + (l.km || 0), 0)
  };
}
