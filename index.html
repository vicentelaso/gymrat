<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymRat">
<title>GymRat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;
  --s1:#141414;
  --s2:#222222;
  --line:#2c2c2c;
  --tx:#F5F3F0;
  --mu:#A39E98;
  --ac:#FF6A1F;
  --red:#FF7A7A;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:'Barlow',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;min-height:100dvh;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,label{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 18px calc(env(safe-area-inset-bottom,0px) + 120px)}
.mu{color:var(--mu)}
.small{font-size:14px}
.grow{flex:1;min-width:0}
[hidden]{display:none!important}

/* barras superiores */
.top{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;white-space:nowrap;font-family:var(--cond);font-weight:800;font-size:24px;letter-spacing:.01em}
.tools{display:flex;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s1);flex:none}
.iconbtn.sm{width:40px;height:40px;border-radius:12px;background:var(--s2)}
.txtbtn{height:44px;padding:0 14px;border-radius:14px;background:var(--s1);font-weight:600;font-size:15px}
.install{height:44px;padding:0 12px;border-radius:14px;background:var(--ac);color:#000;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.hdr{display:flex;align-items:center;gap:8px;height:56px}
.hdr .ttl{flex:1;text-align:center;font-weight:600;font-size:15px;color:var(--mu);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hdr .sp{width:44px}

/* inicio */
.hello{color:var(--mu);font-size:18px;margin:26px 0 0}
h1.title{font-family:var(--cond);font-weight:800;font-size:52px;line-height:.92;margin:4px 0 22px;letter-spacing:-.005em}
.week{display:flex;gap:4px;width:100%;margin-bottom:26px;padding:0}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.wd i{width:34px;height:34px;border-radius:50%;background:var(--s1);display:grid;place-items:center;font-style:normal;font-size:14px;color:var(--mu);font-weight:500}
.wd.on i{background:var(--ac);color:#000;font-weight:700}
.wd.today i{box-shadow:inset 0 0 0 2px var(--tx);color:var(--tx)}
.wd.on.today i{color:#000}
.tiles{display:flex;flex-direction:column;gap:10px}
.tile{display:flex;align-items:center;gap:14px;width:100%;background:var(--s1);border-radius:24px;padding:20px 20px 20px 22px;min-height:100px;transition:transform .12s ease}
.tile:active,.item .main:active,.row:active{transform:scale(.985)}
.tile .nm{display:block;font-family:var(--cond);font-weight:700;font-size:32px;line-height:1}
.tile .sub{display:block;color:var(--mu);font-size:14px;margin-top:6px}
.tile .meta{margin-left:auto;text-align:right;font-size:13px;color:var(--mu);white-space:nowrap;align-self:flex-start;padding-top:4px}
.tile.sug{box-shadow:inset 0 0 0 2px var(--ac)}
.tag{display:block;color:var(--ac);font-weight:700;font-size:14px;margin-bottom:2px}
.alt-toggle{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mu);font-size:15px;padding:14px;margin:18px auto 0;min-height:44px}
.alts{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:var(--s1);border-radius:18px;min-height:60px;transition:transform .12s ease}
.row .rn{display:block;font-weight:600;font-size:17px}
.row .sub{display:block;color:var(--mu);font-size:14px}
.addrow{background:none;border:1.5px dashed var(--line);color:var(--mu);justify-content:center;font-weight:600}
.empty{color:var(--mu);text-align:center;padding:26px 10px;font-size:15px;margin:0}

/* listas */
h2.pt{font-family:var(--cond);font-weight:800;font-size:44px;line-height:.95;margin:12px 0 8px}
.crumb{color:var(--mu);font-size:15px;margin:0 0 18px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:8px;background:var(--s1);border-radius:20px;min-height:72px;padding-right:12px}
.item .main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:14px 6px 14px 18px;align-self:stretch;transition:transform .12s ease}
.item .nm{display:block;font-family:var(--cond);font-weight:700;font-size:27px;line-height:1.05}
.item.ex .nm{font-family:inherit;font-weight:600;font-size:17px;line-height:1.25}
.item .sub{display:block;color:var(--mu);font-size:14px;margin-top:3px}
.item .meta{font-size:13px;color:var(--mu);white-space:nowrap;text-align:right}
.chev{color:#5a5752;display:grid}
.badge{background:var(--ac);color:#000;font-weight:700;font-size:14px;border-radius:999px;min-width:28px;height:28px;padding:0 9px;display:grid;place-items:center;flex:none}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;border:1.5px dashed var(--line);border-radius:20px;color:var(--mu);font-weight:600;margin-top:10px}

/* buscador y filtros */
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.search input{width:100%;height:52px;border-radius:16px;background:var(--s1);border:1.5px solid transparent;color:var(--tx);font-size:17px;padding:0 16px 0 46px;outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--ac)}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 12px;padding:0 18px 2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips .chip{flex:none}
.mdesc{background:var(--s1);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--mu);margin:0 0 12px;line-height:1.45}
.mdesc b{color:var(--tx)}

/* ejercicio */
.last{background:var(--s1);border-radius:20px;padding:16px 18px;font-size:16px;line-height:1.5;margin-bottom:12px}
.last b{color:var(--ac);font-weight:700}
.last .rec{display:block;color:var(--mu);font-size:14px;margin-top:6px}
.logger{background:var(--s1);border-radius:26px;padding:16px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.h3{font-weight:700;font-size:17px}
.seg{display:inline-flex;background:#000;border-radius:13px;padding:3px}
.seg button{text-align:center;padding:0 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mu);min-height:36px}
.seg button.on{background:var(--tx);color:#000}
.seg.wide{display:flex}
.seg.wide button{flex:1;min-height:44px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:block;background:#000;border-radius:18px;padding:10px 12px 8px;border:1.5px solid transparent;cursor:text}
.fld:focus-within{border-color:var(--ac)}
.fld span{display:block;color:var(--mu);font-size:14px}
.num{width:100%;background:none;border:0;color:var(--tx);font-family:var(--cond);font-weight:700;font-size:54px;padding:0;line-height:1.1;outline:none;-moz-appearance:textfield}
.num::placeholder{color:#3d3b38}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cta{display:grid;place-items:center;width:100%;height:60px;border-radius:18px;background:var(--ac);color:#000;font-weight:700;font-size:18px;margin-top:12px;transition:transform .1s}
.cta:active{transform:scale(.99)}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.set{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:14px;background:#000;min-height:52px}
.set .n{color:var(--mu);font-size:14px;width:56px;flex:none}
.set .v{font-family:var(--cond);font-size:24px;font-weight:700}
.set .lb{color:var(--mu);font-size:14px}
.pr{color:var(--ac);font-size:12px;font-weight:700;border:1.5px solid var(--ac);border-radius:7px;padding:1px 6px}
.del{margin-left:auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mu);flex:none}
.card{background:var(--s1);border-radius:26px;padding:16px 16px 14px;margin-top:12px}
.chart svg{width:100%;height:auto;display:block;margin-top:6px}
.cinfo{font-size:15px;text-align:center;min-height:22px;margin:2px 0 0}
.cinfo b{color:var(--ac)}
.hist{margin-top:12px;background:var(--s1);border-radius:22px;padding:4px 16px}
.hist summary{list-style:none;padding:14px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:44px}
.hist summary::-webkit-details-marker{display:none}
.hrow{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hrow .hd{width:64px;color:var(--mu);flex:none}
.hrow .hs{display:flex;flex-wrap:wrap;gap:4px 12px}

/* barra fija de hoy */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(to bottom,rgba(0,0,0,0),#000 35%)}
.dock .in{max-width:524px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.dock .cta,.dock .btn2{margin:0;height:56px}

/* hoja inferior */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#ov.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#121212;border-radius:30px 30px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:50;visibility:hidden}
#sheet.on{transform:none;visibility:visible}
.grab{width:42px;height:5px;border-radius:3px;background:#3a3a3a;margin:0 auto 16px}
.sh-t{font-family:var(--cond);font-weight:800;font-size:32px;line-height:1;margin:0 0 14px}
.inp{width:100%;height:56px;border-radius:16px;background:#000;border:1.5px solid var(--line);color:var(--tx);font-size:17px;padding:0 16px;outline:none}
.inp:focus{border-color:var(--ac)}
.lbl{display:block;color:var(--mu);font-size:14px;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 16px;min-height:44px;border-radius:999px;background:#000;border:1.5px solid var(--line);font-size:15px;white-space:nowrap}
.fchips .chip{background:var(--s1);border-color:var(--s1)}
.chip.on,.fchips .chip.on{background:var(--ac);border-color:var(--ac);color:#000;font-weight:600}
.chip.add{border-style:dashed;color:var(--mu)}
.inrow{display:flex;gap:8px;margin-top:10px}
.inrow .btn2{width:auto;padding:0 18px;flex:none;height:56px;margin:0}
.btn2{display:grid;place-items:center;height:54px;border-radius:16px;background:var(--s2);font-weight:600;width:100%;margin-top:10px;cursor:pointer}
.btn2.danger{color:var(--red)}
.cta.dangerbg{background:var(--red)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:18px;padding:14px 16px;border-radius:16px;background:#000;border:1.5px solid var(--line)}
.switch small{display:block;color:var(--mu);font-size:14px}
.switch i{width:50px;height:30px;border-radius:15px;background:#3a3a3a;position:relative;flex:none;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch i.on{background:var(--ac)}
.switch i.on::after{transform:translateX(20px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn2{margin-top:0}
.steps{margin:0;padding-left:22px;line-height:1.7}

/* registro de hoy */
.tx{background:#000;border-radius:18px;padding:12px 8px 8px 14px;margin-bottom:8px}
.tx .tn{font-weight:600;padding-right:6px}
.tx .tm{color:var(--mu);font-size:14px}
.tx .set{background:none;padding-left:0;min-height:46px}

/* calendario */
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calh .sh-t{margin:0;text-align:center;flex:1;font-size:28px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;margin-top:14px}
.cal .dw{font-size:12px;color:var(--mu);padding:4px 0}
.cal button{aspect-ratio:1;border-radius:50%;font-size:15px;display:grid;place-items:center;max-width:46px;width:100%;margin:0 auto}
.cal button:disabled{color:#77736e;cursor:default}
.cal .tr{background:var(--ac);color:#000;font-weight:700}
.cal .td{box-shadow:inset 0 0 0 2px var(--tx)}
.cal .sel{outline:2px solid var(--tx);outline-offset:2px}
.calsub{text-align:center;color:var(--mu);font-size:14px;margin:4px 0 0}
.sum{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.sum-d{font-family:var(--cond);font-weight:700;font-size:26px;margin:0 0 10px}
.sum-r{background:#000;border-radius:18px;padding:14px 16px;margin-bottom:8px}
.sum-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.sum-h .rn{font-weight:700;font-size:17px}
.sum-x{padding:8px 0;border-top:1px solid #1f1f1f;font-size:15px}
.sum-x .sx{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mu);margin-top:2px}

/* resumen final */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.stat{background:#000;border-radius:18px;padding:14px 16px}
.stat b{display:block;font-family:var(--cond);font-size:38px;font-weight:800;line-height:1.05}
.stat span{color:var(--mu);font-size:14px}
.prrow{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.prrow b{color:var(--ac);white-space:nowrap}

/* acceso */
.login{display:flex;flex-direction:column;padding-top:9vh}
.lg-logo{display:flex;justify-content:center;margin-bottom:14px}
.login h1.title{text-align:center;margin:0 0 6px}
.lg-sub{text-align:center;margin:0 0 22px}
.lg-note{margin:12px 0 0}
.check{display:flex;align-items:center;gap:12px;margin:16px 0 0;min-height:44px;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ac);margin:0}
.err{color:var(--red);margin:12px 0 0;font-size:15px;text-align:center}
.cta:disabled{opacity:.6}
.acct{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#000;border:1.5px solid var(--line);border-radius:16px;padding:12px 12px 12px 16px}
.acct small{display:block;color:var(--mu);font-size:13px}
.txtbtn.danger{color:var(--red);background:var(--s2);flex:none}

/* avisos */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);background:var(--tx);color:#000;border-radius:16px;padding:12px 16px;font-weight:600;z-index:60;display:flex;gap:16px;align-items:center;width:max-content;max-width:calc(100% - 32px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#toast.on{transform:translate(-50%,0)}
#toast button{color:#C24A0C;font-weight:700;min-height:32px}

.view{animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"><div id="view"></div></main>
<div id="dockwrap"></div>
<div id="ov" data-act="close"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
'use strict';
/* ---------- utilidades ---------- */
const KEY = 'gymrat:v1';
const LB = 0.45359237;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const norm = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const slug = (s) => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || uid();
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const pd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const fLong = (s) => new Intl.DateTimeFormat('es-CL', { weekday: 'long', day: 'numeric', month: 'long' }).format(pd(s)).replace(',', '');
const fShort = (s) => new Intl.DateTimeFormat('es-CL', { day: 'numeric', month: 'short' }).format(pd(s)).replace('.', '');
const daysAgo = (s) => Math.round((pd(today()) - pd(s)) / 864e5);
const rel = (s) => { const n = daysAgo(s); return n === 0 ? 'Hoy' : n === 1 ? 'Ayer' : n < 7 ? `Hace ${n} días` : fShort(s); };
const nf = (n, d = 1) => Number(n).toLocaleString('es-CL', { maximumFractionDigits: d });
const kg = (n) => nf(n) + ' kg';
const parseNum = (v) => parseFloat(String(v).replace(',', '.'));
const inNum = (n) => String(Math.round(n * 100) / 100).replace('.', ',');
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;

const I = {
  back: '<path d="M15 5l-7 7 7 7"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  up: '<path d="M6 15l6-6 6 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  set: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  dl: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'
};
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

function seedParts() {
  return CATALOG.map((p) => {
    const pid = slug(p.n);
    return {
      id: pid, name: p.n,
      muscles: p.muscles.map(([n, d]) => ({ n, d })),
      ex: p.muscles.flatMap(([m, , exs]) => exs.map((e) => ({ id: pid + '_' + slug(e), name: e, m })))
    };
  });
}
function seed() {
  return {
    v: 2, parts: seedParts(),
    routines: [
      { id: 'r1', name: 'Espalda y bíceps', parts: ['espalda', 'biceps'], fav: true },
      { id: 'r2', name: 'Hombro y tríceps', parts: ['hombros', 'triceps'], fav: true },
      { id: 'r3', name: 'Piernas', parts: ['piernas'], fav: true },
      { id: 'r4', name: 'Pecho y abs', parts: ['pecho', 'abdominales'], fav: true },
      { id: 'r5', name: 'Full body', parts: ['pecho', 'espalda', 'piernas', 'hombros'], fav: false }
    ],
    logs: [],
    settings: { name: '', unit: 'kg', asked: false }
  };
}
/* pasa los datos de la versión con "tipos" a la versión con músculos, sin perder series */
function migrate(s) {
  if (s.v >= 2) return s;
  const fresh = seedParts();
  const remap = {};
  const parts = s.parts.map((op) => {
    let np = fresh.find((p) => p.id === op.id);
    if (!np) np = { id: op.id, name: op.name, muscles: [], ex: [] };
    (op.types || []).forEach((t) => {
      t.ex.forEach((e) => {
        const hit = np.ex.find((x) => norm(x.name) === norm(e.name));
        if (hit) remap[e.id] = hit.id;
        else {
          if (!np.muscles.some((m) => m.n === t.name)) np.muscles.push({ n: t.name, d: '' });
          np.ex.push({ id: e.id, name: e.name, m: t.name });
        }
      });
    });
    return np;
  });
  fresh.forEach((p) => { if (!parts.some((x) => x.id === p.id)) parts.push(p); });
  s.logs.forEach((l) => { if (remap[l.x]) l.x = remap[l.x]; });
  s.parts = parts;
  s.v = 2;
  return s;
}

async function loadUserData() {
  loadErr = '';
  const local = readCache();
  let remote = null, fetchOk = false;
  try {
    const { data, error } = await sb.from(TABLE).select('data, ts').eq('user_id', USER.id).maybeSingle();
    if (!error) { fetchOk = true; if (data && data.data) { remote = migrate(data.data); remote.ts = remote.ts || data.ts || 0; } }
    else console.warn('GymRat load', error);
  } catch (e) {}
  if (!fetchOk && !local) { S = null; loadErr = 'Necesitas internet la primera vez que entras con esta cuenta en este teléfono.'; return; }
  let chosen, upload = false;
  if (remote && local) { chosen = (local.ts || 0) > (remote.ts || 0) ? local : remote; upload = chosen === local; }
  else if (remote) chosen = remote;
  else if (local) { chosen = local; upload = true; }
  else {
    const old = legacyLocal();
    chosen = old || seed(); upload = true;
    if (old) { localStorage.removeItem(KEY); setTimeout(() => toast('Tus entrenamientos anteriores quedaron en tu cuenta'), 400); }
  }
  S = chosen;
  S.settings = Object.assign({ name: '', unit: 'kg' }, S.settings);
  S.settings.asked = true;
  if (!S.settings.name) S.settings.name = cap(userName());
  if (localStorage.getItem(cacheKey() + ':dirty')) upload = true;
  if (upload) save();
  else { localStorage.setItem(cacheKey(), JSON.stringify(S)); dirty = false; syncState = 'ok'; }
}
async function refreshFromCloud() {
  if (!USER || !sb || dirty || pushing) return;
  try {
    const { data, error } = await sb.from(TABLE).select('data, ts').eq('user_id', USER.id).maybeSingle();
    if (error || !data || !data.data) return;
    if ((data.ts || 0) > (S?.ts || 0) && !dirty) {

}

    const d = new Date(mon); d.setDate(mon.getDate() + i);

    h += `<span class="wd${on ? ' on' : ''}${s === today() ? ' today' : ''}"><span>${L[i]}</span><i>${d.getDate()}</i></span>`;

function exStats() {

  return { c, last };
}

}
function applyFilter() {
  const p = P(parse()[3]); if (!p) return;
  const f = filt[p.id]; const q = norm(f.q.trim());
  let shown = 0;
  document.querySelectorAll('#exlist .item').forEach((el) => {
    const ok = (!q || el.dataset.n.includes(q)) && (!f.m || el.dataset.m === f.m);
    el.hidden = !ok; if (ok) shown++;
  });

}

function defaultDraft(xid) {
  const logs = S.logs.filter((l) => l.x === xid).sort(byTs);
  const s = logs[logs.length - 1];
  if (!s) return { w: '', reps: '' };
  const u = S.settings.unit;
  let w;
  if (u === 'kg') w = s.u === 'kg' ? s.raw : Math.round(s.kg * 2) / 2;
  else w = s.u === 'lb' ? s.raw : Math.round((s.kg / LB) * 2) / 2;
  return { w: inNum(w), reps: String(s.reps) };
}
let draft = null;
function vEx(r, xid) {

    const best = topSet(prev.flatMap((x) => x.sets));

  const hist = days.length ? `<details class="hist"><summary>Historial <span class="mu small">${plural(days.length, 'día', 'días')}</span></summary>

  </details>` : '';
  return `${hdr(`/r/${r.id}/p/${p.id}`, p.name)}

      <div class="lhead"><span class="h3">Serie ${td.length + 1}</span>

      </div>
      <div class="fields">
        <label class="fld"><span>Peso (${u})</span><input id="fw" class="num" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="0" value="${esc(dr.w)}"></label>
        <label class="fld"><span>Repeticiones</span><input id="fr" class="num" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" placeholder="0" value="${esc(dr.reps)}"></label>
      </div>
      <button class="cta" data-act="add">Guardar serie</button>
      ${sets ? `<div class="sets">${sets}</div>` : ''}

        <div class="seg" role="group" aria-label="Qué mostrar">${[['peso', 'Peso'], ['reps', 'Reps'], ['rm', '1RM']].map(([k, l]) => `<button data-act="cm" data-m="${k}" class="${chartM === k ? 'on' : ''}" aria-pressed="${chartM === k}">${l}</button>`).join('')}</div>
      </div>
      <div id="chart" class="chart">${chartHTML(xid)}</div>

}

/* ---------- gráfico ---------- */
function chartPoints(xid) {
  const days = byDay(S.logs.filter((l) => l.x === xid)).slice(-24);
  return days.map(({ d, sets }) => {
    const b = topSet(sets);
    if (chartM === 'reps') {
      const mr = Math.max(...sets.filter((s) => s.kg === b.kg).map((s) => s.reps));
      return { d, v: mr, t: `${mr} reps con ${kg(b.kg)}` };
    }
    if (chartM === 'rm') {
      const v = Math.max(...sets.map((s) => s.kg * (1 + s.reps / 30)));
      return { d, v, t: `1RM estimado de ${kg(v)}` };
    }
    return { d, v: b.kg, t: `${kg(b.kg)} × ${b.reps} reps` };
  });
}
function chartHTML(xid) {
  const pts = chartPoints(xid);
  if (!pts.length) return `<p class="empty">Aquí verás tu progreso cuando registres series.</p>`;
  const n = pts.length, W = 340, H = 180, l = 38, r = 14, tp = 14, b = 26;
  const vs = pts.map((p) => p.v);
  let mn = Math.min(...vs), mx = Math.max(...vs);
  if (mn === mx) { mn -= Math.max(1, mn * 0.1); mx += Math.max(1, mx * 0.1); }
  const padv = (mx - mn) * 0.15; mn -= padv; mx += padv;
  if (mn < 0 && Math.min(...vs) >= 0) mn = 0;
  const X_ = (i) => (n === 1 ? l + (W - l - r) / 2 : l + (i * (W - l - r)) / (n - 1));
  const Y_ = (v) => tp + (1 - (v - mn) / (mx - mn)) * (H - tp - b);
  const sel = chartSel == null || chartSel >= n ? n - 1 : chartSel;
  let g = '';
  for (let k = 0; k <= 2; k++) {
    const v = mn + ((mx - mn) * k) / 2, y = Y_(v).toFixed(1);
    g += `<line x1="${l}" x2="${W - r}" y1="${y}" y2="${y}" stroke="#262626" stroke-width="1"/><text x="${l - 8}" y="${y}" dy="4" text-anchor="end" font-size="11" fill="#8a8580">${nf(v, chartM === 'reps' ? 0 : 1)}</text>`;
  }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X_(i).toFixed(1)} ${Y_(p.v).toFixed(1)}`).join(' ');
  const area = n > 1 ? `<path d="${line} L${X_(n - 1).toFixed(1)} ${H - b} L${X_(0).toFixed(1)} ${H - b} Z" fill="#FF6A1F" fill-opacity=".12"/>` : '';
  const dots = pts.map((p, i) => i === sel
    ? `<circle cx="${X_(i).toFixed(1)}" cy="${Y_(p.v).toFixed(1)}" r="6.5" fill="#FF6A1F"/>`
    : `<circle cx="${X_(i).toFixed(1)}" cy="${Y_(p.v).toFixed(1)}" r="3.5" fill="#000" stroke="#FF6A1F" stroke-width="2"/>`).join('');
  const hits = pts.map((p, i) => `<circle cx="${X_(i).toFixed(1)}" cy="${Y_(p.v).toFixed(1)}" r="16" fill="transparent" data-act="pt" data-i="${i}" style="cursor:pointer"/>`).join('');
  const xl = `<text x="${X_(0).toFixed(1)}" y="${H - 6}" text-anchor="${n === 1 ? 'middle' : 'start'}" font-size="11" fill="#8a8580">${fShort(pts[0].d)}</text>` +
    (n > 1 ? `<text x="${X_(n - 1).toFixed(1)}" y="${H - 6}" text-anchor="end" font-size="11" fill="#8a8580">${fShort(pts[n - 1].d)}</text>` : '');
  const sp = pts[sel];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de progreso">${g}${area}<path d="${line}" fill="none" stroke="#FF6A1F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}${hits}</svg>
    <p class="cinfo">${cap(fShort(sp.d))}: <b>${sp.t}</b></p>`;
}

/* calendario */
let calM = null, calSel = null;
function openCal() {
  const t = pd(today());
  calM = new Date(t.getFullYear(), t.getMonth(), 1);
  calSel = S.logs.some((l) => l.d === today()) ? today() : null;
  renderCal();
}
function renderCal() {
  const y = calM.getFullYear(), m = calM.getMonth();
  const first = (new Date(y, m, 1).getDay() + 6) % 7;
  const nd = new Date(y, m + 1, 0).getDate();
  const days = new Set(S.logs.map((l) => l.d));
  let g = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((d) => `<span class="dw">${d}</span>`).join('');
  for (let i = 0; i < first; i++) g += '<span></span>';
  let cnt = 0;
  for (let d = 1; d <= nd; d++) {
    const s = `${y}-${pad(m + 1)}-${pad(d)}`;
    const tr = days.has(s); if (tr) cnt++;
    g += `<button class="${tr ? 'tr' : ''}${s === today() ? ' td' : ''}${s === calSel ? ' sel' : ''}" data-act="cday" data-d="${s}" ${tr ? '' : 'disabled'} aria-label="${fLong(s)}${tr ? ', entrenaste' : ''}">${d}</button>`;
  }
  const title = new Intl.DateTimeFormat('es-CL', { month: 'long', year: 'numeric' }).format(calM);
  openSheet(`<div class="calh"><button class="iconbtn" data-act="cmove" data-d="-1" aria-label="Mes anterior">${ic('back')}</button><h2 class="sh-t">${cap(title.replace(' de ', ' '))}</h2><button class="iconbtn" data-act="cmove" data-d="1" aria-label="Mes siguiente">${ic('chev')}</button></div>
    <p class="calsub">${cnt ? `Entrenaste ${plural(cnt, 'día', 'días')} este mes` : 'Sin entrenamientos este mes'}</p>
    <div class="cal">${g}</div>
    ${calSel ? daySummary(calSel) : `<p class="calsub" style="margin-top:16px">Toca un día naranjo para ver lo que hiciste.</p>`}`);
}
function daySummary(d) {
  const ls = S.logs.filter((l) => l.d === d).sort(byTs);
  if (!ls.length) return '';
  const byR = {};
  ls.forEach((l) => (byR[l.r] || (byR[l.r] = [])).push(l));
  let h = `<div class="sum"><h3 class="sum-d">${cap(fLong(d))}</h3>`;
  for (const [rid, arr] of Object.entries(byR)) {
    const vol = arr.reduce((a, l) => a + l.kg * l.reps, 0);
    const byX = [];
    arr.forEach((l) => { let g = byX.find((x) => x.x === l.x); if (!g) byX.push((g = { x: l.x, name: X(l.x)?.e.name || l.name, sets: [] })); g.sets.push(l); });
    h += `<div class="sum-r"><div class="sum-h"><span class="rn">${esc(R(rid)?.name || arr[0].rn || 'Rutina')}</span><span class="mu small">${plural(arr.length, 'serie', 'series')}, ${nf(vol, 0)} kg</span></div>
      ${byX.map((g) => `<div class="sum-x">${esc(g.name)}<div class="sx">${g.sets.map((s) => `<span>${nf(s.kg)} kg × ${s.reps}</span>`).join('')}</div></div>`).join('')}</div>`;
  }
  return h + '</div>';
}

/* ajustes */
function openSettings() {
  const u = S.settings.unit;
  openSheet(`<h2 class="sh-t">Ajustes</h2>
    <label class="lbl" for="sn">Tu nombre</label>
    <input id="sn" class="inp" data-bind="sname" value="${esc(S.settings.name)}" placeholder="Para saludarte" maxlength="30">
    <p class="lbl">Cuenta</p>
    <div class="acct"><span>Conectado como <b>${esc(userName())}</b><small>${syncState === 'ok' ? 'Todo guardado en tu cuenta' : syncState === 'pend' ? 'Guardando cambios…' : 'Sin conexión: se subirá cuando vuelva internet'}</small></span><button class="txtbtn danger" data-act="logout">Cerrar sesión</button></div>
    <p class="lbl">Unidad por defecto</p>
    <div class="seg wide" role="group" aria-label="Unidad por defecto"><button data-act="sunit" data-u="kg" class="${u === 'kg' ? 'on' : ''}">Kilos</button><button data-act="sunit" data-u="lb" class="${u === 'lb' ? 'on' : ''}">Libras</button></div>
    ${isStandalone() ? '' : `<p class="lbl">App</p><button class="btn2" data-act="install" style="margin-top:0">Instalar GymRat en el teléfono</button>`}
    <p class="lbl">Respaldo</p>
    <p class="mu small" style="margin:0 0 10px">Tus datos ya se guardan en tu cuenta. Igual puedes descargar una copia en un archivo.</p>
    <div class="two"><button class="btn2" data-act="exp">Descargar</button><label class="btn2" for="imp">Restaurar</label></div>
    <input id="imp" type="file" accept="application/json,.json" hidden>`);
}

/* resumen final */
function fmtDur(min) {
  if (min < 1) return '—';
  if (min < 60) return Math.round(min) + ' min';
  return `${Math.floor(min / 60)} h ${Math.round(min % 60)}`;
}
function finish(rid) {
  const r = R(rid);
  const td = todayR(rid);
  if (!td.length) return;
  const vol = td.reduce((a, l) => a + l.kg * l.reps, 0);
  const exs = new Set(td.map((l) => l.x)).size;
  const dur = (td[td.length - 1].ts - td[0].ts) / 60000;
  const prs = td.filter((l) => l.pr);
  openSheet(`<h2 class="sh-t">Entrenamiento terminado</h2>
    <p class="mu" style="margin:0 0 12px">${esc(r.name)}, ${fLong(today())}</p>
    <div class="stats">
      <div class="stat"><b>${td.length}</b><span>Series</span></div>
      <div class="stat"><b>${exs}</b><span>${exs === 1 ? 'Ejercicio' : 'Ejercicios'}</span></div>
      <div class="stat"><b>${nf(vol, 0)}</b><span>Kilos levantados</span></div>
      <div class="stat"><b>${fmtDur(dur)}</b><span>Duración</span></div>
    </div>
    ${prs.length ? `<p class="lbl">Récords de hoy</p>${prs.map((l) => `<div class="prrow"><span>${esc(X(l.x)?.e.name || l.name)}</span><b>${kg(l.kg)} × ${l.reps}</b></div>`).join('')}` : ''}
    <button class="cta" data-act="done">Listo</button>`);
}

/* ---------- avisos ---------- */
let tT = null, TA = null;
function toast(msg, act) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (act ? `<button data-act="tact">${esc(act.label)}</button>` : '');
  TA = act?.fn || null;
  t.classList.add('on');
  clearTimeout(tT);
  tT = setTimeout(() => t.classList.remove('on'), act ? 5000 : 2600);
}

/* ---------- pantalla encendida mientras registras ---------- */
let wl = null, wantWake = false;
async function wake(on) {
  wantWake = on;
  try {
    if (on && !wl && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    } else if (!on && wl) { await wl.release(); wl = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wantWake) wake(true); });

/* ---------- acciones ---------- */
const curX = () => parse()[3];
function removeSet(id) {
  const i = S.logs.findIndex((l) => l.id === id); if (i < 0) return;
  const [rm] = S.logs.splice(i, 1); save();
  toast('Serie borrada', { label: 'Deshacer', fn: () => { S.logs.push(rm); save(); if (sheetRender) sheetRender(); else render(); } });
  if (sheetRender) { sheetRender(); render(); } else render();
}
const A = {
  back: (el) => back(el.dataset.to),
  nav: (el) => go(el.dataset.to),
  open: (el) => go('/r/' + el.dataset.r),
  alt: () => { altOpen = !altOpen; render(); },
  cal: () => openCal(),
  settings: () => openSettings(),
  install: () => install(),
  close: () => closeSheet(),
  edit: () => { edit = !edit; render(); },
  amode: (el) => { loginDraft = { u: $('#lu').value, pw: $('#lp').value }; authMode = el.dataset.m; authErr = ''; render(); },
  auth: () => doAuth(),
  logout: () => {
    if (!S) { logout(); return; }
    confirmS({ title: '¿Cerrar sesión?', text: 'Tus entrenamientos quedan guardados en tu cuenta.', cta: 'Cerrar sesión', ok: () => { sheetRender = null; $('#ov').classList.remove('on'); $('#sheet').classList.remove('on'); logout(); } });
  },
  retry: async () => { await loadUserData(); render(); },

  newR: () => editRoutine(null),
  editR: (el) => editRoutine(el.dataset.r),
  erp: (el) => { const id = el.dataset.p; ER.parts = ER.parts.includes(id) ? ER.parts.filter((x) => x !== id) : [...ER.parts, id]; renderER(); },
  ernp: () => { newPart = true; renderER(); setTimeout(() => $('#npn')?.focus(), 50); },
  ernpok: () => {
    const v = $('#npn').value.trim(); if (!v) return;
    let id = slug(v); if (P(id)) id += '-' + uid().slice(0, 4);
    S.parts.push({ id, name: v, muscles: [], ex: [] }); ER.parts.push(id); save();
    newPart = false; renderER();
  },
  erfav: () => { ER.fav = !ER.fav; renderER(); },
  ersave: () => {
    const name = ER.name.trim();
    if (!name) { toast('Ponle un nombre a la rutina'); $('#ern').focus(); return; }
    if (!ER.parts.length) { toast('Elige al menos una parte del cuerpo'); return; }
    if (ER.id) Object.assign(R(ER.id), { name, parts: ER.parts, fav: ER.fav });
    else { S.routines.push({ id: 'r' + uid(), name, parts: ER.parts, fav: ER.fav }); if (!ER.fav) altOpen = true; }
    save(); closeSheet(); toast(ER.id ? 'Cambios guardados' : 'Rutina creada');
  },
  erdel: () => {
    const r = R(ER.id);
    confirmS({ title: '¿Eliminar rutina?', text: `Se borrará «${esc(r.name)}». Tus series registradas se mantienen en el calendario.`, cta: 'Eliminar', ok: () => {
      S.routines = S.routines.filter((x) => x.id !== r.id); save();
      history.replaceState({ d: 0 }, '', '#/'); toast('Rutina eliminada');
    } });
  },

  newEx: (el) => editEx(el.dataset.p, null),
  editEx: (el) => editEx(parse()[3], el.dataset.id),
  exm: (el) => { EX.m = el.dataset.m; renderEX(); },
  exnm: () => { EX.newM = true; renderEX(); setTimeout(() => $('#nmn')?.focus(), 50); },
  exnmok: () => {
    const v = $('#nmn').value.trim(); if (!v) return;
    const p = P(EX.pid);
    if (!p.muscles.some((m) => norm(m.n) === norm(v))) p.muscles.push({ n: v, d: '' });
    EX.m = p.muscles.find((m) => norm(m.n) === norm(v)).n; EX.newM = false; save(); renderEX();
  },
  exsave: () => {
    const name = EX.name.trim();
    if (!name) { toast('Ponle un nombre al ejercicio'); $('#exn').focus(); return; }
    const p = P(EX.pid);
    if (EX.id) {
      const e = p.ex.find((x) => x.id === EX.id);
      e.name = name; e.m = EX.m;
      S.logs.forEach((l) => { if (l.x === e.id) l.name = name; });
    } else {
      p.ex.push({ id: p.id + '_' + slug(name) + '-' + uid().slice(0, 4), name, m: EX.m });
      filt[p.id] = { q: '', m: '' };
    }
    save(); closeSheet(); toast(EX.id ? 'Cambios guardados' : 'Ejercicio agregado');
  },
  exdel: () => {
    const p = P(EX.pid); const e = p.ex.find((x) => x.id === EX.id);
    confirmS({ title: '¿Eliminar ejercicio?', text: `Se borrará «${esc(e.name)}» de la lista. Las series ya registradas se mantienen en el calendario.`, cta: 'Eliminar', ok: () => { p.ex = p.ex.filter((x) => x.id !== e.id); save(); } });
  },
  cfok: () => { const f = PEND; PEND = null; f?.(); if ($('#sheet').classList.contains('on')) closeSheet(); },

  fm: (el) => {
    const p = P(parse()[3]);
    filt[p.id].m = el.dataset.m;
    render();
  },

  unit: (el) => {
    const u = el.dataset.u; if (u === S.settings.unit) return;
    const raw = $('#fw').value; const w = parseNum(raw);
    let nw = '';
    if (raw !== '' && !isNaN(w)) nw = inNum(u === 'lb' ? Math.round((w / LB) * 2) / 2 : Math.round(w * LB * 2) / 2);
    draft = { x: curX(), w: nw, reps: $('#fr').value };
    S.settings.unit = u; save(); render();
  },
  add: () => {
    const s = parse(), rid = s[1], xid = s[3], f = X(xid);
    const w = $('#fw').value.trim() === '' ? 0 : parseNum($('#fw').value);
    const reps = parseInt($('#fr').value, 10);
    if (isNaN(w) || w < 0) { toast('Revisa el peso'); $('#fw').focus(); return; }
    if (!reps || reps < 1) { toast('Anota las repeticiones'); $('#fr').focus(); return; }
    const u = S.settings.unit;
    const kgv = u === 'lb' ? w * LB : w;
    const before = S.logs.filter((l) => l.x === xid);
    const nSet = before.filter((l) => l.d === today()).length + 1;
    const hadPast = before.some((l) => l.d !== today());
    const prevMax = Math.max(0, ...before.map((l) => l.kg));
    const pr = hadPast && kgv > prevMax + 1e-9;
    const log = { id: uid(), d: today(), ts: Date.now(), x: xid, name: f.e.name, r: rid, rn: R(rid)?.name, kg: kgv, raw: w, u, reps, pr };
    S.logs.push(log);
    save();
    draft = null;
    document.activeElement?.blur();
    try { navigator.vibrate?.(pr ? [60, 60, 120] : 40); } catch (e) {}
    const msg = pr ? `Nuevo récord: ${kg(kgv)} × ${reps}` : `Serie ${nSet} guardada: ${nf(kgv)} kg × ${reps}`;
    back(`/r/${rid}/p/${f.p.id}`);
    setTimeout(() => toast(msg, { label: 'Deshacer', fn: () => { S.logs = S.logs.filter((l) => l.id !== log.id); save(); render(); } }), 60);
  },
  delset: (el) => removeSet(el.dataset.id),
  tact: () => { const f = TA; TA = null; $('#toast').classList.remove('on'); f?.(); },
  cm: (el) => { chartM = el.dataset.m; chartSel = null; draft = { x: curX(), w: $('#fw').value, reps: $('#fr').value }; render(); },
  pt: (el) => { chartSel = Number(el.dataset.i); $('#chart').innerHTML = chartHTML(curX()); },

  today: (el) => openToday(el.dataset.r),
  finish: (el) => finish(el.dataset.r),
  done: () => { sheetRender = null; $('#ov').classList.remove('on'); $('#sheet').classList.remove('on'); goHome(); },

  cmove: (el) => { calM = new Date(calM.getFullYear(), calM.getMonth() + Number(el.dataset.d), 1); calSel = null; renderCal(); },
  cday: (el) => { calSel = el.dataset.d; renderCal(); setTimeout(() => $('#sheet .sum')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 30); },

  sunit: (el) => { S.settings.unit = el.dataset.u; save(); openSettings(); },
  exp: () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `gymrat-respaldo-${today()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast('Respaldo descargado');
  }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const f = A[el.dataset.act];
  if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('input', (e) => {
  const t = e.target, b = t.dataset?.bind;
  if (b === 'ername' && ER) ER.name = t.value;
  if (b === 'exname' && EX) EX.name = t.value;
  if (b === 'sname') { S.settings.name = t.value; save(); }
  if (t.id === 'lu') loginDraft.u = t.value;
  if (t.id === 'lp') loginDraft.pw = t.value;
  if (t.id === 'q') { const p = P(parse()[3]); if (p) { filt[p.id].q = t.value; applyFilter(); } }
  if (t.id === 'fw') t.value = t.value.replace(/[^0-9.,]/g, '');
  if (t.id === 'fr') t.value = t.value.replace(/[^0-9]/g, '');
  if (t.id === 'fw' || t.id === 'fr') draft = { x: curX(), w: $('#fw').value, reps: $('#fr').value };
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'lu') { e.preventDefault(); $('#lp').focus(); }
  else if (id === 'lp') { e.preventDefault(); doAuth(); }
  else if (id === 'npn') A.ernpok();
  else if (id === 'nmn') A.exnmok();
  else if (id === 'fw') { e.preventDefault(); $('#fr').focus(); }
  else if (id === 'fr') { e.preventDefault(); A.add(); }
  else if (id === 'q') e.target.blur();
});
document.addEventListener('focusin', (e) => { if (e.target.classList?.contains('num')) setTimeout(() => e.target.select(), 0); });
document.addEventListener('change', (e) => {
  if (e.target.id !== 'imp') return;
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d.parts || !d.routines || !d.logs) throw new Error();
      confirmS({ title: '¿Restaurar respaldo?', text: `Tus datos actuales se reemplazarán por los del archivo (${plural(d.logs.length, 'serie', 'series')}).`, cta: 'Restaurar', ok: () => { S = migrate(d); S.settings = Object.assign({ name: '', unit: 'kg', asked: true }, S.settings); save(); toast('Respaldo restaurado'); } });
    } catch (err) { toast('Ese archivo no es un respaldo de GymRat'); }
  };
  rd.readAsText(file);
});

/* ---------- inicio ---------- */
async function boot() {
  if (!history.state) history.replaceState({ d: 0 }, '', location.hash || '#/');
  render();
  if (configured) {
    makeClient(remembered());
    try {
      const { data } = await sb.auth.getSession();
      if (data?.session?.user) { USER = data.session.user; await loadUserData(); }
    } catch (e) {}
  }
  booting = false;
  render();
}
boot();
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
